<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>12-Lead ECG Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg-outer,#060606);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:100vh;font-family:'Share Tech Mono',monospace;color:var(--text-bright,#00ff88);padding:16px;}
  .monitor{width:1100px;background:var(--bg-monitor,#050f08);border:1px solid var(--monitor-border,#003318);border-radius:6px;padding:14px 18px 14px;box-shadow:0 0 0 1px #001a0c,0 0 60px rgba(0,255,100,0.04),inset 0 1px 0 rgba(0,255,100,0.04);position:relative;}
  .monitor::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent,transparent 3px,rgba(0,0,0,0.06) 3px,rgba(0,0,0,0.06) 4px);pointer-events:none;z-index:10;border-radius:6px;}
  .header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
  .header-left{display:flex;flex-direction:column;gap:3px;}
  .title-label{font-family:'Orbitron',monospace;font-size:11px;letter-spacing:3px;color:var(--text-mid,#00cc66);opacity:0.7;}
  .hr-block{text-align:right;}
  .hr-label{font-size:9px;letter-spacing:2px;color:#00aa55;opacity:0.6;display:block;}
  .hr-value{font-family:'Orbitron',monospace;font-size:32px;font-weight:700;color:var(--text-bright,#00ff88);line-height:1;text-shadow:none;}
  .hr-unit{font-size:9px;color:#00aa55;opacity:0.6;letter-spacing:1px;}
  .rhythm-name{font-family:'Orbitron',monospace;font-size:9px;letter-spacing:3px;color:var(--text-bright,#00ff88);opacity:0.75;text-align:right;margin-top:2px;min-height:13px;}
  .ecg-area{position:relative;}
  .ecg-bg-canvas{position:absolute;top:0;left:0;z-index:1;pointer-events:none;}
  .leads-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;position:relative;z-index:2;}
  .lead-cell{position:relative;background:transparent;}
  .lead-cell:nth-child(4n){border-right:none;}
  .lead-label-tag{position:absolute;top:3px;left:5px;font-size:12px;font-weight:bold;letter-spacing:1px;color:var(--trace,#00cc66);opacity:0.9;z-index:5;pointer-events:none;}
  canvas.trace-c{position:absolute;top:0;left:0;z-index:2;background:transparent;width:100%;height:100%;}
  .strip-wrapper{position:relative;z-index:2;background:transparent;}
  .strip-label{position:absolute;top:3px;left:5px;font-size:9px;letter-spacing:1px;color:var(--text-dim,#00cc66);opacity:0.7;z-index:5;pointer-events:none;}
  canvas.strip-grid{position:absolute;top:0;left:0;z-index:1;background:#020a04;}
  canvas.strip-trace{position:absolute;top:0;left:0;z-index:2;background:transparent;}
  .controls{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
  .rhythm-grid{display:flex;flex-wrap:wrap;gap:4px;}
  .rhythm-grid .btn{flex:1 1 calc(14.28% - 4px);min-width:75px;max-width:150px;}
  .btn{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:1px;padding:5px 4px;background:transparent;border:1px solid #003a1a;color:#008844;cursor:pointer;border-radius:2px;transition:all .12s;text-align:center;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .btn:hover{background:var(--btn-active-bg,rgba(0,255,100,0.06));border-color:var(--text-dim,#006633);color:var(--text-mid,#00cc66);}
  .btn.active{background:var(--btn-active-bg,rgba(0,255,100,0.10));border-color:var(--btn-active-border,#00cc66);color:var(--btn-active-text,#00ff88);box-shadow:none;}
  .slider-row{display:flex;align-items:center;gap:12px;height:26px;}
  .slider-label{font-size:9px;letter-spacing:2px;color:#00aa55;opacity:.7;white-space:nowrap;width:50px;}
  .slider-bpm{font-family:'Orbitron',monospace;font-size:12px;color:var(--text-bright,#00ff88);width:58px;text-align:right;white-space:nowrap;}
  input[type=range]{-webkit-appearance:none;flex:1;height:3px;background:#003318;border-radius:2px;outline:none;cursor:pointer;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--text-bright,#00ff88);cursor:pointer;box-shadow:none;}
  input[type=range]:disabled{opacity:.2;cursor:default;}
  input[type=range]:disabled::-webkit-slider-thumb{cursor:default;}
  .slider-note{font-size:9px;color:#005522;letter-spacing:1px;white-space:nowrap;width:180px;text-align:right;}
  .stemi-btn{border-color:#4a1500!important;color:#cc4400!important;}
  .stemi-btn:hover{background:rgba(255,80,0,0.08)!important;border-color:#aa3300!important;color:#ff6622!important;}
  .stemi-btn.active{background:rgba(255,80,0,0.14)!important;border-color:#ff5500!important;color:#ff7744!important;box-shadow:0 0 10px rgba(255,80,0,0.25)!important;}
  .footer{display:flex;justify-content:space-between;margin-top:8px;font-size:9px;letter-spacing:2px;color:#003a1a;}
  :root {
    --bg-outer:#060606;--bg-monitor:#050f08;--bg-canvas:#020a04;
    --trace:#00ff88;--trace-glow:rgba(0,255,136,0.20);
    --grid-small:rgba(0,110,50,0.30);--grid-large:rgba(0,160,70,0.55);
    --border:#003318;--text-bright:#00ff88;--text-mid:#00cc66;
    --text-dim:#00aa55;--text-dimmer:#005522;
    --btn-border:#003a1a;--btn-text:#008844;
    --btn-active-bg:rgba(0,255,100,0.10);--btn-active-border:#00cc66;
    --btn-active-text:#00ff88;--monitor-border:#003318;
  }
  body{background:var(--bg-outer);color:var(--text-bright);}
  .monitor{background:var(--bg-monitor)!important;border-color:var(--monitor-border)!important;}
  .hr-value{color:var(--text-bright)!important;text-shadow:none;}
  .hr-label,.hr-unit,.lead-label,.title-label{color:var(--text-dim)!important;}
  .rhythm-name{color:var(--text-bright)!important;text-shadow:none;}
  .btn{border-color:var(--btn-border)!important;color:var(--btn-text)!important;}
  .btn.active{background:var(--btn-active-bg)!important;border-color:var(--btn-active-border)!important;color:var(--btn-active-text)!important;box-shadow:none!important;}
  .slider-label,.hr-unit{color:var(--text-dim)!important;}
  .slider-bpm{color:var(--text-bright)!important;}
  .slider-note,.footer span{color:var(--text-dimmer)!important;}
  input[type=range]{background:var(--btn-border)!important;}
  input[type=range]::-webkit-slider-thumb{background:var(--text-bright)!important;box-shadow:none!important;}
  .theme-btn.active{box-shadow:0 0 8px var(--text-bright)!important;}

  /* ── Second-screen display mode ──────────────────────────────────────
     Loaded as ecg.html?display=<code>. Everything that would name the
     rhythm or let the viewer change it is hidden — the point is a bare
     trace on a projector/tablet the student reads without being told
     what they are looking at. */
  body.display-mode{padding:0;justify-content:center;}
  body.display-mode .monitor{width:100vw;max-width:none;border:none;border-radius:0;padding:10px 12px;}
  body.display-mode .controls,
  body.display-mode .footer,
  body.display-mode .title-label,
  body.display-mode .rhythm-name,
  body.display-mode #captureBtn,
  body.display-mode #secondScreenRow,
  body.display-mode .bbb-row,
  body.display-mode .theme-row{display:none!important;}
  body.display-mode #ssStatus{position:fixed;bottom:6px;left:8px;font-size:9px;letter-spacing:1px;color:var(--text-dimmer,#005522);opacity:.6;}

  /* ── Mobile remote-control mode ────────────────────────────────
     On a phone the trace is too small to read anyway, so the page becomes
     the remote instead: controls plus the second-screen link, with the ECG
     itself parked off-screen. Off-screen rather than display:none because
     the engine still owns the rhythm catalogue the controls read, and its
     own IntersectionObserver pauses the drawing loop while it is out of
     view — so this costs nothing to keep alive. */
  body.mobile-mode .monitor{width:100%;max-width:520px;display:flex;flex-direction:column;padding:12px;}
  /* !important because the engine sets position:relative inline on its own
     container at init — without it the parked trace stays in flow and
     leaves a screen-high gap above the controls. */
  body.mobile-mode .ecg-area{position:absolute!important;left:-10000px!important;top:0;width:1100px!important;height:420px;pointer-events:none;}
  body.mobile-mode #secondScreenRow{order:-1;margin:0 0 10px;flex-wrap:wrap;}
  body.mobile-mode #secondScreenBtn,
  body.mobile-mode #captureBtn{flex:1 1 100%;padding:11px 4px;font-size:11px;}
  body.mobile-mode .footer{display:none;}
  body.mobile-mode .rhythm-grid .btn{flex:1 1 calc(33.33% - 4px);max-width:none;min-width:0;padding:9px 3px;font-size:9px;}
  body.mobile-mode .bbb-row .btn,body.mobile-mode .theme-row .btn{padding:9px 4px;}
  body.mobile-mode .theme-row{flex-wrap:wrap;}
  /* The desktop layout ellipsises long labels to keep the button grid on
     one line. There is far less width here, so wrap instead — a remote
     whose buttons read 'RANDOM …' and 'STEMI — ANTERI…' is worse than a
     slightly taller grid. */
  body.mobile-mode .btn{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.3;}
  body.mobile-mode .slider-note{display:none;}
  body.mobile-mode .hr-value{font-size:26px;}
  #ssCodeBadge{display:none;font-size:9px;letter-spacing:2px;color:var(--text-mid,#00cc66);opacity:.8;margin-top:6px;width:100%;text-align:center;}
  #ssCodeBadge.on{display:block;}
  .ss-code{font-family:'Orbitron',monospace;font-size:20px;letter-spacing:4px;color:var(--text-bright,#00ff88);margin-top:12px;}

  /* ── Second-screen QR modal ───────────────────────────────────────── */
  .ss-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;}
  .ss-backdrop.open{display:flex;}
  .ss-card{background:var(--bg-monitor,#050f08);border:1px solid var(--btn-active-border,#00cc66);border-radius:6px;padding:20px;max-width:360px;width:100%;text-align:center;}
  .ss-card h3{font-family:'Orbitron',monospace;font-size:12px;letter-spacing:3px;color:var(--text-bright,#00ff88);font-weight:700;margin-bottom:6px;}
  .ss-card p{font-size:10px;letter-spacing:1px;color:var(--text-dim,#00aa55);line-height:1.6;margin-bottom:12px;}
  #ssQr{background:#fff;padding:10px;border-radius:4px;display:inline-block;min-height:40px;}
  #ssQr img,#ssQr canvas{display:block;}
  .ss-url{margin-top:12px;font-size:9px;letter-spacing:.5px;color:var(--text-mid,#00cc66);word-break:break-all;}
  .ss-url a{color:inherit;}
</style>
</head>
<body>
<div class="monitor">
  <div class="header">
    <div class="header-left">
      <div class="title-label">12-LEAD ECG</div>
    </div>
    <div class="hr-block">
      <span class="hr-label">HEART RATE</span>
      <span class="hr-value" id="hrValue">72</span>
      <span class="hr-unit"> BPM</span>
      <div class="rhythm-name" id="rhythmName">SINUS RHYTHM</div>
    </div>
  </div>

  <div class="ecg-area" id="ecgArea">
    <canvas id="ecgBgGrid"></canvas>
    <div class="leads-grid" id="leadsGrid"></div>
    <div class="strip-wrapper" id="stripWrapper">
      <span class="strip-label">LEAD II — RHYTHM STRIP</span>
    </div>
  </div>

  <div class="controls">
    <div class="rhythm-grid">
      <button class="btn active" id="btn-nsr"   onclick="setRhythm('nsr')">NSR</button>
      <button class="btn"        id="btn-stach"  onclick="setRhythm('stach')">Sinus Tachy</button>
      <button class="btn"        id="btn-sbrad"  onclick="setRhythm('sbrad')">Sinus Brady</button>
      <button class="btn"        id="btn-svt"    onclick="setRhythm('svt')">SVT</button>
      <button class="btn"        id="btn-af"     onclick="setRhythm('af')">Af</button>
      <button class="btn"        id="btn-aflut"  onclick="setRhythm('aflut')">A Flutter</button>
      <button class="btn"        id="btn-vt"     onclick="setRhythm('vt')">VT</button>
      <button class="btn"        id="btn-vf"     onclick="setRhythm('vf')">VF</button>
      <button class="btn"        id="btn-mob1"   onclick="setRhythm('mob1')">Mobitz I</button>
      <button class="btn"        id="btn-mob2"   onclick="setRhythm('mob2')">Mobitz II</button>
      <button class="btn"        id="btn-chb"    onclick="setRhythm('chb')">3° Block</button>
      <button class="btn"        id="btn-asys"   onclick="setRhythm('asys')">Asystole</button>
      <button class="btn"        id="btn-aivr"    onclick="setRhythm('aivr')">Idioventricular</button>
      <button class="btn"        id="btn-vvipace" onclick="setRhythm('vvipace')">Paced — VVI</button>
      <button class="btn"        id="btn-deg1"    onclick="setRhythm('deg1')">1° AV Block</button>
      <button class="btn"        id="btn-junct"   onclick="setRhythm('junct')">Junctional</button>
      <button class="btn"        id="btn-wpw"     onclick="setRhythm('wpw')">WPW</button>
      <button class="btn"        id="btn-pvc"     onclick="setRhythm('pvc')">PVC Bigeminy</button>
      <button class="btn"        id="btn-hyperK"  onclick="setRhythm('hyperK')">Hyperkalaemia</button>
      <button class="btn"        id="btn-hypoK"   onclick="setRhythm('hypoK')">Hypokalaemia</button>
      <button class="btn"        id="btn-longQT"  onclick="setRhythm('longQT')">Long QT</button>
      <button class="btn"        id="btn-peri"    onclick="setRhythm('peri')">Pericarditis</button>
      <button class="btn"        id="btn-nstemi"  onclick="setRhythm('nstemi')">NSTEMI</button>
      <button class="btn"        id="btn-pe"      onclick="setRhythm('pe')">Pulm. Embolism</button>
      <button class="btn"        id="btn-brugada" onclick="setRhythm('brugada')">Brugada</button>
      <button class="btn"        id="btn-aaipace" onclick="setRhythm('aaipace')">Paced — AAI</button>
      <button class="btn"        id="btn-dddpace" onclick="setRhythm('dddpace')">Paced — DDD</button>
    </div>
    <div class="rhythm-grid" style="margin-top:4px;">
      <button class="btn stemi-btn" id="btn-stemi-inf"  onclick="setRhythm('stemi-inf')">STEMI — Inferior</button>
      <button class="btn stemi-btn" id="btn-stemi-ant"  onclick="setRhythm('stemi-ant')">STEMI — Anterior</button>
      <button class="btn stemi-btn" id="btn-stemi-lat"  onclick="setRhythm('stemi-lat')">STEMI — Lateral</button>
      <button class="btn stemi-btn" id="btn-stemi-post" onclick="setRhythm('stemi-post')">STEMI — Posterior</button>
    </div>
    <div class="slider-row">
      <span class="slider-label">RATE</span>
      <input type="range" id="hrSlider" min="60" max="100" value="72" oninput="onSlider(this.value)">
      <span class="slider-bpm" id="sliderBpm">72 BPM</span>
      <span class="slider-note" id="sliderNote"></span>
    </div>
  </div>
  <div class="bbb-row" style="margin-top:10px;display:flex;gap:8px;align-items:center;">
    <span style="font-size:9px;letter-spacing:2px;color:var(--text-dim,#00aa55);opacity:.7">BBB:</span>
    <button class="btn" id="bbb-none" onclick="setBBB('none')">NONE</button>
    <button class="btn" id="bbb-lbbb" onclick="setBBB('lbbb')">LBBB</button>
    <button class="btn" id="bbb-rbbb" onclick="setBBB('rbbb')">RBBB</button>
  </div>
  <div class="theme-row" style="margin-top:8px;display:flex;gap:6px;align-items:center;">
    <span style="font-size:9px;letter-spacing:2px;color:var(--text-dim);opacity:.7;white-space:nowrap;">THEME:</span>
    <button class="btn theme-btn active" id="theme-monitor" onclick="setTheme('monitor')" style="flex:1">⬛ MONITOR</button>
    <button class="btn theme-btn" id="theme-paper" onclick="setTheme('paper')" style="flex:1">📄 PAPER</button>
    <button class="btn theme-btn" id="theme-random"       onclick="setTheme('random')"       style="flex:1;font-size:9px;">RANDOM DARK</button>
    <button class="btn theme-btn" id="theme-random-paper" onclick="setTheme('random-paper')" style="flex:1;font-size:9px;">RANDOM PAPER</button>
  </div>
  <div id="secondScreenRow" style="margin-top:8px;display:flex;gap:8px;align-items:center;">
    <button id="captureBtn" class="btn" onclick="toggleCapture()"
      style="flex:1;letter-spacing:2px;text-transform:uppercase;font-size:10px;">
      ⏸ CAPTURE
    </button>
    <button id="secondScreenBtn" class="btn" onclick="openSecondScreen()"
      style="flex:1;letter-spacing:2px;text-transform:uppercase;font-size:10px;">
      📺 SECOND SCREEN
    </button>
    <div id="ssCodeBadge"></div>
  </div>
  <div id="captureFlash" style="position:fixed;inset:0;background:white;opacity:0;pointer-events:none;z-index:9999;transition:opacity 0.15s;"></div>
  <div class="footer">
    <span>25 MM/SEC</span><span>10 MM/MV</span><span>0.05–150 HZ</span>
  </div>
</div>

<div class="ss-backdrop" id="ssModal" onclick="if(event.target===this)closeSecondScreen()">
  <div class="ss-card">
    <h3>SECOND SCREEN</h3>
    <p id="ssHint">Scan on the viewing device, or open the link below on it. It
      shows this trace only &mdash; no controls, no rhythm name &mdash; and follows
      every change you make here.</p>
    <div id="ssQr"></div>
    <div class="ss-url" id="ssUrl"></div>
    <button class="btn" onclick="closeSecondScreen()" style="margin-top:14px;width:100%;">CLOSE</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://1984tpearson.github.io/dash/ecg_engine.js"></script>
<script>
let _ecg = null;
let _currentKey = 'nsr';
let _currentBBB = 'none';
let _currentTheme = 'monitor';
let _currentBpm = 72;
let _isMobile = false;
// The engine's capture button is a three-state cycle (arm -> freeze at the
// next lead boundary -> resume), not a toggle, and the freeze lands wherever
// each screen's own sweep happens to be. So what travels to the second
// screen is the PRESS, as a counter, not a derived on/off state: both ends
// then run the same sequence of presses through the same state machine.
let _captureSeq = 0;

// ── Second-screen sync ──────────────────────────────────────────────────
// A viewing device loads this same file as ecg.html?display=<code> and
// renders the trace alone (see .display-mode CSS). There is no server here,
// so the two screens meet on one Supabase row: the control screen writes
// {key,bpm,bbb,theme,capture} on every change, the display screen polls it.
// The row is the whole protocol — nothing else is shared.
const SS_SUPABASE_URL = 'https://befsjenbaruxqrntuhpn.supabase.co';
const SS_SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJlZnNqZW5iYXJ1eHFybnR1aHBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI2MjA5MjAsImV4cCI6MjA4ODE5NjkyMH0.hOFFbIvd1wAgu-QyghupQ-7ttSpg7sxz_UsJbXyXztA';
const SS_POLL_MS = 1200;
const SS_TABLE = 'ecg_display_sessions';

let _sb = null;
let _ssCode = null;          // set on the control screen once sharing starts
let _displayCode = null;     // set on the display screen
let _ssPublishTimer = null;

function ssClient() {
  if (_sb) return _sb;
  if (typeof supabase === 'undefined') return null;
  _sb = window.__avSupabaseClient
     || (window.__avSupabaseClient = supabase.createClient(SS_SUPABASE_URL, SS_SUPABASE_KEY));
  return _sb;
}

function ssNewCode() {
  // Short and unambiguous — this ends up in a URL people may retype.
  const alphabet = 'abcdefghjkmnpqrstuvwxyz23456789';
  const bytes = new Uint8Array(7);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, b => alphabet[b % alphabet.length]).join('');
}

function ssState() {
  return { key: _currentKey, bpm: _currentBpm, bbb: _currentBBB,
           theme: _currentTheme, captureSeq: _captureSeq };
}

// The rate slider fires continuously while dragged, so writes are coalesced
// to one per SS_PUBLISH_MS rather than one per input event.
const SS_PUBLISH_MS = 300;
function publishState() {
  if (!_ssCode || _ssPublishTimer) return;
  _ssPublishTimer = setTimeout(async () => {
    _ssPublishTimer = null;
    const sb = ssClient();
    if (!sb) return;
    const { error } = await sb.from(SS_TABLE)
      .upsert({ code: _ssCode, state: ssState(), updated_at: new Date().toISOString() });
    if (error) console.warn('second screen publish failed', error);
  }, SS_PUBLISH_MS);
}

async function openSecondScreen() {
  const modal = document.getElementById('ssModal');
  const hint = document.getElementById('ssHint');
  const sb = ssClient();
  if (!sb) { alert('Second screen needs a network connection.'); return; }

  if (!_ssCode) {
    _ssCode = ssNewCode();
    const { error } = await sb.from(SS_TABLE)
      .upsert({ code: _ssCode, state: ssState(), updated_at: new Date().toISOString() });
    if (error) {
      _ssCode = null;
      hint.textContent = 'Could not start a second-screen session: ' + error.message;
      modal.classList.add('open');
      return;
    }
    const btn = document.getElementById('secondScreenBtn');
    if (btn) btn.classList.add('active');
  }

  const url = location.origin + location.pathname + '?display=' + _ssCode;
  const urlEl = document.getElementById('ssUrl');
  urlEl.innerHTML = '<div class="ss-code">' + _ssCode.toUpperCase() + '</div>'
    + '<a href="' + url + '" target="_blank" rel="noopener">' + url + '</a>';
  const badge = document.getElementById('ssCodeBadge');
  if (badge) { badge.textContent = 'SECOND SCREEN \u2192 ' + _ssCode.toUpperCase(); badge.classList.add('on'); }

  // The QR is a convenience over the link, not the only way in — if the
  // generator script did not load, the URL above still works.
  const qrEl = document.getElementById('ssQr');
  qrEl.innerHTML = '';
  if (typeof qrcode === 'function') {
    try {
      const qr = qrcode(0, 'M');
      qr.addData(url);
      qr.make();
      qrEl.innerHTML = qr.createImgTag(5, 8);
    } catch (e) {
      qrEl.innerHTML = '<span style="color:#333;font-size:10px;">QR unavailable — use the link below</span>';
    }
  } else {
    qrEl.innerHTML = '<span style="color:#333;font-size:10px;">QR unavailable — use the link below</span>';
  }
  modal.classList.add('open');
}

function closeSecondScreen() {
  document.getElementById('ssModal').classList.remove('open');
}

// ── Display screen ──────────────────────────────────────────────────────
function applyRemoteState(st) {
  if (!_ecg || !st) return;
  if (st.theme && st.theme !== _currentTheme) {
    _currentTheme = st.theme;
    _ecg.setTheme(_currentTheme);
  }
  if (st.key !== _currentKey || st.bbb !== _currentBBB || st.bpm !== _currentBpm) {
    _currentKey = st.key;
    _currentBBB = st.bbb || 'none';
    _currentBpm = st.bpm;
    _ecg.setRhythm(_currentKey, _currentBpm, _currentBBB);
    const r = _ecg._pub && _ecg._pub.rhythms && _ecg._pub.rhythms[_currentKey];
    document.getElementById('hrValue').textContent =
      (r && r.sliderMin !== null && r.sliderMin !== undefined) ? _currentBpm : '\u2014';
  }
  // Replay presses rather than compare states. Polling can coalesce a rapid
  // arm-then-cancel into a single observed jump, so the seq is clamped to one
  // press per poll — and a rhythm change resets both ends anyway, so any
  // drift is self-healing.
  const seq = st.captureSeq || 0;
  if (seq !== _captureSeq) {
    _captureSeq = seq;
    _ecg.toggleCapture();
  }
}

async function pollDisplay() {
  const sb = ssClient();
  const status = document.getElementById('ssStatus');
  if (!sb) return;
  const { data, error } = await sb.from(SS_TABLE)
    .select('state').eq('code', _displayCode).maybeSingle();
  if (error) { if (status) status.textContent = 'RECONNECTING\u2026'; return; }
  if (!data) { if (status) status.textContent = 'SESSION NOT FOUND'; return; }
  if (status) status.textContent = '';
  applyRemoteState(data.state);
}

window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(location.search);
  _displayCode = params.get('display');
  if (_displayCode) document.body.classList.add('display-mode');

  // A phone drives the second screen rather than trying to be one. ?remote=1
  // forces it on a larger screen, which is also how it gets tested.
  _isMobile = !_displayCode
    && (params.get('remote') === '1'
        || window.matchMedia('(max-width:700px)').matches);
  if (_isMobile) document.body.classList.add('mobile-mode');

  const ecgArea = document.getElementById('ecgArea');
  const monitor = document.querySelector('.monitor');
  if (monitor && !ecgArea.clientWidth) {
    ecgArea.style.width = (monitor.clientWidth - 36) + 'px';
  }
  _ecg = new ECGEngine(ecgArea, {
    mode: '12lead',
    theme: 'monitor',
    showControls: false,
  });

  if (_displayCode) {
    const status = document.createElement('div');
    status.id = 'ssStatus';
    status.textContent = 'CONNECTING\u2026';
    document.body.appendChild(status);
    setTimeout(() => { pollDisplay(); setInterval(pollDisplay, SS_POLL_MS); }, 150);
    // The engine sizes its canvases from the container width once, at init.
    // On a viewing device that is rotated mid-session the only reliable fix
    // is a fresh load — the state lives in the row, so nothing is lost.
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => location.reload(), 400);
    });
    return;
  }

  // Short delay to ensure engine _pub is fully initialised before syncing UI
  setTimeout(() => setRhythm('nsr'), 100);
});

function setRhythm(key) {
  if (!_ecg) return;
  _currentKey = key;
  const r = _ecg._pub && _ecg._pub.rhythms && _ecg._pub.rhythms[key];
  const bpm = r ? r.defaultBpm : 72;
  _currentBpm = bpm;
  _ecg.setRhythm(key, bpm, _currentBBB);

  // Update slider
  const slider = document.getElementById('hrSlider');
  const sliderBpm = document.getElementById('sliderBpm');
  if (r && r.sliderMin !== null && r.sliderMin !== undefined) {
    slider.disabled = false;
    slider.min = r.sliderMin;
    slider.max = r.sliderMax;
    slider.value = bpm;
    sliderBpm.textContent = bpm + ' BPM';
  } else {
    slider.disabled = true;
    sliderBpm.textContent = '\u2014 BPM';
  }

  document.getElementById('sliderNote').textContent = r ? (r.sliderNote || '') : '';
  document.getElementById('rhythmName').textContent = r ? r.label : '';
  document.getElementById('hrValue').textContent = (r && r.sliderMin !== null) ? bpm : '\u2014';

  document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('btn-' + key);
  if (btn) btn.classList.add('active');
  publishState();
}

function onSlider(val) {
  if (!_ecg) return;
  const bpm = parseInt(val);
  _currentBpm = bpm;
  _ecg.onSlider(bpm);
  document.getElementById('sliderBpm').textContent = bpm + ' BPM';
  document.getElementById('hrValue').textContent = bpm;
  publishState();
}

function setBBB(mode) {
  if (!_ecg) return;
  _currentBBB = mode;
  _ecg.setBBB(mode);
  document.querySelectorAll('[id^="bbb-"]').forEach(b => b.classList.remove('active'));
  const el = document.getElementById('bbb-' + mode);
  if (el) el.classList.add('active');
  publishState();
}

function setTheme(name) {
  if (!_ecg) return;
  _currentTheme = name;
  _ecg.setTheme(name);
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
  const el = document.getElementById('theme-' + name);
  if (el) el.classList.add('active');
  publishState();
}

function toggleCapture() {
  if (!_ecg) return;
  _captureSeq++;
  if (_isMobile) {
    // The trace is parked off-screen here and the engine has auto-paused it,
    // so driving its capture state machine locally would only desynchronise
    // the button's own label. The press is published; the second screen is
    // what actually freezes.
    const btn = document.getElementById('captureBtn');
    if (btn) btn.textContent = (_captureSeq % 2) ? '\u25b6 RESUME' : '\u23f8 CAPTURE';
  } else {
    _ecg.toggleCapture();
  }
  publishState();
}
</script>
</body>
</html>
