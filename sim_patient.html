// Treat/Assess/Talk — see CLAUDE.md. Gated the same way answerPatientQuestion
// (sim_control.html) gates a directly-asked question — gcsV tiering, generic
// sounds/fragments below gcsV 4 — plus SimEngine's own unresponsive flag,
// since an unresponsive patient shouldn't mutter an old line just because a
// timer fired (same rule pain/nausea already follow, cutting to 0 in
// lockstep with LOC).
let _lastSpontaneousAt = 0;
let _lastSpontaneousText = '';
// First one waits a while so a session doesn't open with the patient already
// talking. Lower distressLevel bands then wait longer between remarks than
// higher ones — a comfortable patient has little to spontaneously say; a
// severely distressed one groans/pleads more often.
let _nextSpontaneousDelayMs = 45000 + Math.random() * 60000;
let SPONTANEOUS_INTERVAL_MS_BY_DISTRESS = [
  [90000, 180000], // 0 — comfortable
  [60000, 120000],  // 1 — mild
  [35000, 75000],   // 2 — moderate
  [20000, 45000]    // 3 — severe/critical
];
// Picks a random entry from pool, avoiding an exact repeat of `avoid` when
// the pool has another option to offer instead.
function pickDifferent(pool, avoid) {
  if (!pool || !pool.length) return null;
  if (pool.length === 1) return pool[0];
  let pick;
  do { pick = pool[Math.floor(Math.random() * pool.length)]; } while (pick === avoid);
  return pick;
}
function maybeSaySpontaneousLine(v) {
  if (_voiceModalOpen || _isSpeaking) return; // never interrupt/overlap a real exchange or an already-playing line
  // A live Realtime Voice call owns the patient's voice for its WHOLE life,
  // not just the moments the two flags above happen to cover. Those two miss
  // real windows in that mode: the entire connect gap (key fetch, mic
  // permission, WS handshake — startRealtimeCall() to socket.onopen, before
  // revealRealtimeModal() has set _voiceModalOpen), and the "Thinking…" gap
  // between the student finishing a sentence and Deepgram's audio actually
  // starting (_isSpeaking is only set once audio.play() resolves). A line
  // starting in either window plays through the legacy Piper/Web Speech
  // path while the call answers in Deepgram Aura-2 — two voices, two
  // different voice types, talking over each other.
  if (_rtActive) return;
  if (Date.now() - _lastSpontaneousAt < _nextSpontaneousDelayMs) return;
  const app = SimEngine.getAppearanceState(v);
  if (app.unresponsive) return;
  const gcsV = Math.round(v.gcsV || 0);
  let text;
  if (gcsV <= 1) {
    return; // no verbal capability at all
  } else if (gcsV === 2) {
    text = pickDifferent(SimEngine.GCS_V2_SOUNDS, _lastSpontaneousText);
  } else if (gcsV === 3) {
    text = pickDifferent(SimEngine.GCS_V3_WORDS, _lastSpontaneousText);
  } else {
    // Coherent speech is possible — prefer the scenario's own AI-written
    // bank (filtered to lines tagged for the patient's CURRENT distress
    // band, so a stale "mild discomfort" line can't fire once things have
    // gotten much worse), falling back to the generic pool whenever the
    // scenario bank is empty or has nothing tagged for this band.
    const band = app.distressLevel;
    const scenarioPool = (testConfig.spontaneousLines || [])
      .filter(l => band >= l.distressMin && band <= l.distressMax)
      .map(l => l.text);
    const pool = scenarioPool.length ? scenarioPool
      : SimEngine.GENERIC_SPONTANEOUS_LINES.filter(l => band >= l.distressMin && band <= l.distressMax).map(l => l.text);
    text = pickDifferent(pool, _lastSpontaneousText);
  }
  if (!text) return;
  _lastSpontaneousAt = Date.now();
  _lastSpontaneousText = text;
  const [lo, hi] = SPONTANEOUS_INTERVAL_MS_BY_DISTRESS[Math.min(3, Math.max(0, app.distressLevel))];
  _nextSpontaneousDelayMs = lo + Math.random() * (hi - lo);
  speakAmbientLine(text);
}
// Routed through speakPatientReply() — the same path a spoken reply to a
// crew question takes, so an unprompted remark is in the patient's OWN
// voice, HQ/Piper included when it's enabled. (An earlier version
// deliberately forced the plain standard voice here, on the same reasoning
// sim_control.html's exam findings use for staying off the patient voice —
// wrong analogy: an exam finding is the simulator narrating an observation
// to the crew, whereas an unprompted remark is the patient themselves
// talking, and should sound exactly like the patient always does.)
// isConversation=false and a no-op resume callback: nothing is waiting on
// an ambient line finishing, unlike a real Talk exchange.
function speakAmbientLine(text) {
  if (!_speechUnlocked && !_piperAudioUnlocked) return; // no gesture yet, so no audio API here can actually play — see unlockSpeechSynthesis/unlockPiperAudio
  // speakPatientReply is async, so a rejection escapes a plain try/catch and
  // would surface as an unhandled rejection — .catch() is what actually
  // contains it. Best-effort either way: the timer just tries again later.
  try {
    Promise.resolve(speakPatientReply(text, () => {}, false, hqVoiceEnabled))
      .catch(() => { stopTalkAnimation(); }); // also releases the wake mic if the animation had already started
  } catch (e) { stopTalkAnimation(); }
}

// Opt-in higher-quality patient voice — Piper neural TTS running client-side
// via WebAssembly (@diffusionstudio/vits-web), loaded lazily from a CDN only
// once the student enables it. This deliberately stays a fully optional
// upgrade layered on top of the Web Speech path above, not a replacement:
// it downloads a real ~30-60MB model file (cached in OPFS after first use)
// and depends on WASM/OPFS support, so any failure anywhere in this path
// (module load, OPFS unsupported, network, inference) falls straight back
// to the existing speechSynthesis flow — see speakPatientReply() below.
// No en-AU Piper voices exist upstream, so en_GB/en_US are the closest
// match. Piper's public voice set has no genuinely child-trained voice
// (TTS needs a lot of clean single-speaker recordings, and there's no
// ethically-sourced children's-speech dataset in general circulation) —
// paediatric patients get an adult voice pitched/sped up via
// youthVoiceRate() instead, a real approximation rather than a true
// child voice, same tradeoff already accepted for it.
// OFF by default, and silently so: there used to be a blocking first-load
// "Patient Voice Quality" modal offering the choice before anything else on
// the page could be used, which is no longer the right question to open with
// now that Realtime Voice (further down) is the default "Talk to Patient"
// path and carries its own Deepgram Aura-2 voice. HQ Voice only affects the
// legacy/fallback speech path, so it's a tickbox to find when wanted, not a
// gate to answer up front.
const HQ_VOICE_LS_KEY = 'av_hq_voice_enabled';
let PIPER_MODULE_URL = 'https://cdn.jsdelivr.net/npm/@diffusionstudio/vits-web@1/+esm';
let ELLIPSIS_PAUSE_MS = 550;
let SENTENCE_PAUSE_MS = 220;
let YOUTH_VOICE_RATE_AT_ZERO = 1.22;
let PIPER_WARM_STALL_MS = 60000;
let PIPER_REPLY_STALL_MS = 25000;
// A few voices per gender rather than one fixed pick — same "medium" quality
// tier throughout (a reasonable size/quality balance; "low" sounds worse,
// "high" isn't worth the extra download for a training tool), spanning a
// couple of English accents/timbres for real variety between patients.
let PIPER_VOICE_POOL = {
  male: ['en_GB-alan-medium', 'en_US-ryan-medium', 'en_GB-northern_english_male-medium'],
  female: ['en_GB-jenny_dioco-medium', 'en_US-amy-medium', 'en_GB-alba-medium'],
};
let hqVoiceEnabled = localStorage.getItem(HQ_VOICE_LS_KEY) === '1';
let _piperModulePromise = null;
let _piperModuleFailedOnce = false;

// Picks from the pool using the same per-scenario seed (and same hashStr()
// mechanism) buildAvatarBase() already uses for hair/eyebrow style, with its
// own suffix so the voice pick doesn't land in lockstep with those — stable
// across reconnects for a given patient, not re-rolled every page load.
function piperVoiceIdFor(gender) {
  const pool = PIPER_VOICE_POOL[gender] || PIPER_VOICE_POOL.male;
  const seed = avatarBuild.voiceSeed || sessionCode || 'default';
  return pool[hashStr(seed + ':voice') % pool.length];
}

// Approximates a younger-sounding voice by speeding up/pitching up an adult
// voice — real vocal pitch does run meaningfully higher in young children,
// so this isn't pure fabrication, but it's still a coarse trick (Piper
// output sped up, not a real child voice) and reads as a bit synthetic at
// the low end. Same ageRamp() shape as every other age-scaled constant in
// this file (0 at newborn ramping linearly to 1.0/no-change by 18).
// 1.22 is a deliberately moderate pick — enough to read as younger without
// tipping into "chipmunk".
function youthVoiceRate(years) {
  return ageRamp(years, YOUTH_VOICE_RATE_AT_ZERO, 1.0);
}

// A failed dynamic import() is cached by the browser against its exact URL
// string for the rest of the page's lifetime — resetting _piperModulePromise
// alone does NOT let a later attempt retry, it just replays the same
// rejection forever. Appending a cache-busting query param after the first
// failure gives retries (a new patient reply, warmPiperVoice() firing again,
// re-checking the tickbox) a genuinely fresh URL to fetch instead of being
// permanently wedged by one transient network blip.
function loadPiperModule() {
  if (!_piperModulePromise) {
    const url = _piperModuleFailedOnce ? `${PIPER_MODULE_URL}?retry=${Date.now()}` : PIPER_MODULE_URL;
    _piperModulePromise = import(url).catch(e => {
      _piperModulePromise = null;
      _piperModuleFailedOnce = true;
      throw e;
    });
  }
  return _piperModulePromise;
}

// Visible readout next to the tickbox — without this there was no way to
// tell "using the good voice" from "silently fell back to the standard
// one", short of opening devtools. `detail` is the actual error/stall
// reason — sits in the title tooltip and console for a desktop browser,
// but this is an iPad-first tool and there's no hover/devtools there, so
// on error the status is also made tappable (alert()) as the only way a
// student on a tablet can actually read and relay what went wrong.
function setHqVoiceStatus(text, kind, detail) {
  const el = document.getElementById('hq-voice-status');
  el.textContent = text;
  el.className = kind ? `hq-voice-status-${kind}` : '';
  el.title = detail || '';
  el.onclick = (kind === 'error' && detail) ? () => alert('HQ Voice error:\n\n' + detail) : null;
  if (kind === 'error' && detail) console.warn('HQ Voice unavailable:', detail);
}

// Best-effort prefetch so the model is hopefully already cached in OPFS by
// the time the first patient reply needs it. Also doubles as the only way
// a student finds out ahead of time whether HQ Voice is actually going to
// work on this device/network, via setHqVoiceStatus — previously this was
// silent, so a failure here just looked identical to it never having been
// tried.
//
// 60s stall window, not 15s: the progress callback only covers the network
// fetch — the tail end (writing the ~30-60MB model into OPFS, verifying its
// md5 digest) reports no progress at all, so on a slower device that gap
// alone can exceed a tight stall window and get mistaken for a hang even
// though the download genuinely succeeded (reported as "downloaded, then
// Unavailable"). This is a background prefetch nothing else is waiting on,
// so there's no cost to being patient here — unlike the live per-reply
// path below, which still needs to bail promptly so a real conversation
// doesn't sit in silence.
function warmPiperVoice() {
  if (!hqVoiceEnabled) return;
  setHqVoiceStatus('Checking…');
  runWithStallWatchdog(async bump => {
    const tts = await loadPiperModule();
    bump();
    await tts.download(piperVoiceIdFor(patientGender), progress => {
      bump();
      if (!progress.total) return;
      setHqVoiceStatus(`Downloading… ${Math.round(progress.loaded * 100 / progress.total)}%`);
    });
  }, PIPER_WARM_STALL_MS)
    .then(() => setHqVoiceStatus('Ready', 'ready'))
    .catch(e => setHqVoiceStatus('Unavailable — using standard voice', 'error', e.message));
}

function setHqVoiceEnabled(enabled) {
  hqVoiceEnabled = !!enabled;
  localStorage.setItem(HQ_VOICE_LS_KEY, hqVoiceEnabled ? '1' : '0');
  document.getElementById('hq-voice-checkbox').checked = hqVoiceEnabled;
  if (hqVoiceEnabled) warmPiperVoice();
  else setHqVoiceStatus('');
}

// Runs an async task that periodically signals activity via the `bump`
// function it's handed; if STALL_MS elapses with no bump (network stall,
// a WASM/OPFS step that never settles, etc — anything short of a clean
// reject), the returned promise rejects on its own so callers always get
// *some* outcome instead of hanging forever. `aborted()` lets the task
// check, after each resumption, whether the watchdog already gave up on
// it — needed since the underlying task keeps running in the background
// even after this races it away (there's no way to truly cancel a fetch
// or WASM call), so it must stop short of side effects like playing audio.
function runWithStallWatchdog(taskFn, stallMs) {
  let lastActivity = Date.now();
  let timedOut = false;
  const bump = () => { lastActivity = Date.now(); };
  const aborted = () => timedOut;
  let watchdogTimer;
  const watchdog = new Promise((_, reject) => {
    watchdogTimer = setInterval(() => {
      if (Date.now() - lastActivity > stallMs) {
        timedOut = true;
        clearInterval(watchdogTimer);
        reject(new Error('stalled — no activity for ' + stallMs + 'ms'));
      }
    }, 1000);
  });
  return Promise.race([taskFn(bump, aborted), watchdog]).finally(() => clearInterval(watchdogTimer));
}

// Tries the Piper WASM voice (if enabled) first, falling back to the
// existing Web Speech path on any failure — including partway through
// (module load ok, inference fails, etc) AND including a stall (see
// runWithStallWatchdog — a hung Piper attempt used to mean total silence,
// since nothing ever reached the fallback below it). replyId guards
// against a reply that's no longer current by the time async
// loading/inference finishes (student closed the modal, or a newer reply
// already arrived).
// A new reply always interrupts whatever's still playing from a previous
// one — same "cancel, don't queue" rule the speechSynthesis path already
// had via speechSynthesis.cancel(), extended to cover the Piper <audio>
// element too now that it's a reused singleton (see unlockPiperAudio()).
// Without this, a reply whose Piper synthesis/playback was still running
// when the next reply started speaking would get its src swapped and
// play() called again out from under the still-playing audio — the two
// overlap on the same element instead of one cleanly cutting off the
// other, which is what "talking over himself" actually was.
function stopAnyPatientAudio() {
  if (_piperAudioEl) { try { _piperAudioEl.pause(); } catch (e) {} }
  if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }
}

// Splits a reply into sentence/clause-sized chunks at sentence-ending
// punctuation and ellipses, each synthesized and played as its own separate
// Piper call rather than one predict() over the whole reply. Two problems
// this fixes at once, both traced back to the same cause — Piper's small
// VITS-family model can lose its place ("attention collapse", a known
// failure mode for this model family) on longer, clause-heavy input, which
// is exactly what an AI-written rambling/confused patient produces: it
// reads as the ellipsis pause being ignored (comma-substitution didn't
// actually fix this — the model was garbling regardless of punctuation,
// not skipping past it), AND as the later, longer replies coming out
// jumbled ("talking over himself"/slurred, not overlapping audio — that
// was a separate, already-fixed bug). Keeping each chunk to one clause
// keeps it well inside what these models handle reliably, and splitting on
// punctuation also hands back the real, controllable inter-chunk pause
// (see playPiperChunks()) an ellipsis was supposed to produce in the first
// place, instead of hoping the phonemizer honours it.
function splitIntoPiperChunks(text) {
  const chunks = [];
  const re = /[.!?…]+/g;
  let lastIndex = 0;
  let match;
  while ((match = re.exec(text))) {
    const punct = match[0];
    const end = match.index + punct.length;
    const chunkText = text.slice(lastIndex, end).trim();
    lastIndex = end;
    if (!chunkText) continue;
    const isEllipsis = punct.includes('…') || punct.length >= 3; // "…" or "..." reads as a longer, trailing-off pause than a plain "." "!" "?"
    chunks.push({ text: chunkText, pauseAfterMs: isEllipsis ? ELLIPSIS_PAUSE_MS : SENTENCE_PAUSE_MS });
  }
  const rest = text.slice(lastIndex).trim();
  if (rest) chunks.push({ text: rest, pauseAfterMs: 0 });
  if (!chunks.length) chunks.push({ text: text.trim(), pauseAfterMs: 0 });
  return chunks;
}

// Synthesizes and plays each chunk in order on the given (already-unlocked,
// see unlockPiperAudio()) audio element, with a real setTimeout silence
// between chunks instead of relying on Piper to produce one. bump()/
// stillCurrent()/aborted() thread through to runWithStallWatchdog and the
// reply-staleness guard exactly as the single-call version did. Returns
// whether every chunk played to completion — false on an early bailout
// (stale reply / watchdog abort), so the caller knows NOT to treat this as
// a finished reply (stopTalkAnimation/resumeIfConversing belong to
// whichever reply actually finishes, not one that got superseded
// mid-playback).
async function playPiperChunks(tts, chunks, voiceId, audio, statusEl, priorStatus, bump, stillCurrent, aborted) {
  for (let i = 0; i < chunks.length; i++) {
    if (!stillCurrent() || aborted()) return false;
    const wav = await tts.predict({ text: chunks[i].text, voiceId }, progress => {
      bump();
      if (!stillCurrent() || !progress.total) return;
      statusEl.textContent = `Loading voice… ${Math.round(progress.loaded * 100 / progress.total)}%`;
    });
    bump();
    if (!stillCurrent() || aborted()) return false;
    if (statusEl.textContent !== priorStatus) statusEl.textContent = priorStatus;
    audio.src = URL.createObjectURL(wav);
    await new Promise((resolve, reject) => {
      audio.onended = resolve;
      audio.onerror = () => reject(new Error('audio playback error'));
      audio.play().then(startTalkAnimation).catch(reject);
    });
    bump();
    if (i < chunks.length - 1) {
      if (!stillCurrent() || aborted()) return false;
      await new Promise(r => setTimeout(r, chunks[i].pauseAfterMs));
      bump();
    }
  }
  return true;
}

async function speakPatientReply(text, resumeIfConversing, isConversation, useHqVoice) {
  const replyId = _lastShownReplyId;
  const stillCurrent = () => replyId === _lastShownReplyId;
  stopAnyPatientAudio();
  if (useHqVoice) {
    try {
      await runWithStallWatchdog(async (bump, aborted) => {
        const tts = await loadPiperModule();
        bump();
        if (!stillCurrent() || aborted()) return;
        const voiceId = piperVoiceIdFor(patientGender);
        const statusEl = document.getElementById('voice-modal-status');
        const priorStatus = statusEl.textContent;
        // Reuses the element unlockPiperAudio() already played inside a real
        // tap, rather than constructing a fresh Audio() here — a new element
        // built from this async/poll-driven callback wouldn't count as
        // gesture-initiated on iOS Safari and play() would be rejected. Falls
        // back to a fresh element only if the unlock never ran (e.g. HQ Voice
        // got enabled without the voice modal ever having been opened yet).
        const audio = _piperAudioEl || new Audio();
        // preservesPitch defaults to true (browsers auto-correct pitch when
        // playbackRate changes) — turning it off is what makes the rate
        // change actually sound like a pitch shift, the classic tape-speed
        // effect, rather than just talking faster at the same pitch.
        const rate = youthVoiceRate(avatarBuild.ageYears);
        audio.playbackRate = rate;
        audio.preservesPitch = rate === 1;
        audio.mozPreservesPitch = rate === 1;
        audio.webkitPreservesPitch = rate === 1;
        const chunks = splitIntoPiperChunks(text);
        const finished = await playPiperChunks(tts, chunks, voiceId, audio, statusEl, priorStatus, bump, stillCurrent, aborted);
        if (finished) { stopTalkAnimation(); resumeIfConversing(); }
      }, PIPER_REPLY_STALL_MS); // see warmPiperVoice()'s comment on why this needs real slack, not just enough for the network fetch
      setHqVoiceStatus('Ready', 'ready');
      return;
    } catch (e) {
      // Piper best-effort only (stalled or errored) — fall through to Web Speech below.
      setHqVoiceStatus('Unavailable — using standard voice', 'error', e.message);
    }
  }
  // A reply that's no longer current shouldn't fall back to speaking here
  // either — this matters more than it looks: stopAnyPatientAudio() pausing
  // a still-in-flight Piper attempt (because a NEWER reply just started)
  // makes that attempt's audio.play() reject with an AbortError, which
  // lands in the catch above and, without this guard, would fall through
  // to speaking the now-superseded text via the standard voice anyway —
  // the same reply effectively speaking twice, once cut off mid-Piper and
  // once via the fallback, and wrongly resuming the conversation loop for
  // text that's already been replaced.
  if (!stillCurrent()) return;
  if ('speechSynthesis' in window) {
    try {
      // No cancel() here — stopAnyPatientAudio() already did that at the top
      // of this function. Calling cancel() a second time immediately before
      // speak() (both synchronous, same tick) hits a known Chrome bug where
      // the queued utterance silently never plays — no error, just nothing.
      // This mattered little for chat/treatment replies (HQ Voice normally
      // took the Piper path instead), but exam replies always land here now,
      // so this double-cancel was reliably eating exam audio entirely.
      const utter = new SpeechSynthesisUtterance(text);
      const voice = pickVoice();
      if (voice) utter.voice = voice;
      utter.lang = 'en-AU';
      utter.pitch = youthVoiceRate(avatarBuild.ageYears); // same paediatric approximation as the Piper path, via the API's native pitch control instead of a playbackRate trick
      utter.onstart = startTalkAnimation;
      utter.onend = () => { stopTalkAnimation(); resumeIfConversing(); };
      utter.onerror = () => { stopTalkAnimation(); resumeIfConversing(); };
      window.speechSynthesis.speak(utter);
    } catch (e) {
      // TTS best-effort only — the text is already shown on screen. Still
      // resume the loop after a short pause so a conversation doesn't stall.
      if (isConversation) setTimeout(resumeIfConversing, 1200);
    }
  } else if (isConversation) {
    setTimeout(resumeIfConversing, 1200);
  }
}

// ============================================================================
// --- Realtime Voice (beta): cascaded low-latency conversation pipeline ----
// ============================================================================
// An alternative to the legacy "Talk to Patient" flow above — ON by default
// on browsers that support it, opt-out via the topbar's "⚡ Realtime Voice
// (beta)" checkbox (see the _rtVoiceEnabled default below). Give
// Treatment/Assessment are completely untouched; this only replaces what
// happens when _rtVoiceEnabled is true and the student taps Talk (see the
// branch in handleFabTap()).
//
// Why this exists: the legacy chat flow is genuinely slow by conversational
// standards — a spoken question goes browser SpeechRecognition -> Supabase
// student_queue -> sim_control.html's ~3s poll -> Haiku call -> Supabase
// patient_reply -> this page's own ~3s poll -> speechSynthesis/Piper. That's
// up to two ~3s polling delays plus two full round trips through Postgres
// before a single word is spoken back, and the assessor's tab has to be
// open the whole time or nothing happens at all. This mode collapses that
// into: Deepgram streaming STT (fast, low-latency, native VAD events for
// barge-in) -> a Claude call fired DIRECTLY from this device (same Haiku
// model, same prompt, same GCS-tiering as sim_control.html's
// callPatientAI()/answerPatientQuestion() — duplicated here rather than
// shared, see the PATIENT_VOICE_PROMPT comment in loadSimConfig() above)
// -> Deepgram Aura-2 TTS, played back immediately. No Supabase round trip,
// no dependency on sim_control.html polling. Deepgram covers BOTH halves
// of the voice loop (STT and TTS) deliberately — one vendor/one API key
// instead of two, and Aura-2 turned out cheaper per minute than the
// TTS-specialist alternative (Cartesia) that an earlier pass of this code
// used, at the cost of an unverified (not benchmarked here) latency gap
// versus Cartesia's ~40ms-TTFB-optimized architecture.
//
// Trade-offs accepted for this first pass, deliberately not fixed yet:
// - Assessor-side Log visibility: sim_control.html's `actionLog` is
//   populated only when sim_control.html itself processes a student_queue
//   item — it's never persisted to Supabase (see processStudentQueue()).
//   Since this mode bypasses that queue entirely, exchanges here do NOT
//   currently show up in the assessor's Log tab (only a best-effort write
//   to the row's `patient_reply` field — see handleRealtimeUtterance()).
//   A future pass could patch a proper audit record onto the session row
//   for sim_control.html to pick up; out of scope for this first cut.
// - TTS playback fetches the full Deepgram Aura-2 response before playing
//   (a single <audio> element, same pattern as the legacy Piper path in
//   speakPatientReply()) rather than true streaming playback via Media
//   Source Extensions — for the short (max_tokens 300) replies this engine
//   generates, the difference is small, but a longer reply would benefit
//   from real chunked playback later.
// - Mid-sentence barge-in is enabled but mitigated, not naively trusted:
//   the browser's own echo cancellation wasn't enough on its own to stop
//   Deepgram's VAD from reading the patient's own TTS audio (bleeding from
//   speaker back into mic, no headset) as the student interrupting — first
//   real-device test cut every reply off after a word or two. Fixed with a
//   grace period + confirmation window (see the "Barge-in tuning" comment
//   above _rtBargeInArmedAt) instead of pausing the mic outright, so real
//   interruption still works. Untested against real echo/hardware since
//   this pass — see that comment for what to retune if false cutoffs (or
//   sluggish real ones) come back.
// - Requires Chrome (MediaRecorder) — same constraint the legacy path
//   already has, see getSpeechRecognitionCtor()'s comment above.
// - Requires one more API key (Deepgram — used for BOTH the STT
//   WebSocket and the TTS REST call below) configured in the same
//   Supabase app_config table the Anthropic key already lives in — see
//   getDeepgramKey() below. Until an admin adds a 'deepgram_api_key' row
//   there, the toggle can be switched on but every call attempt fails
//   closed with a clear status message.
// - DEEPGRAM_TTS_VOICE_POOL below is Deepgram's own complete English Aura-2
//   voice table (all 41, transcribed from their docs), not a curated subset.

// --- Config/keys -----------------------------------------------------------
// Mirrors sim_control.html's getAnthropicKey() exactly (same table, same
// column, same caching-then-throw shape) — duplicated rather than shared
// since this file has no import of sim_control.html's script. This only
// ever calls Haiku, same as sim_control.html's own callPatientAI() —
// CLAUDE.md's Sonnet-only rule is about the physiological-trajectory
// reasoning calls, which stay exclusively in sim_control.html; this is the
// same kind of call classifyTreatmentWithHaiku()/callPatientAI() already
// make, just fired from this device instead.
let _cachedAnthropicKey = null;
async function getAnthropicKey() {
  if (_cachedAnthropicKey) return _cachedAnthropicKey;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/app_config?key=eq.anthropic_api_key&select=value`, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
  });
  if (res.ok) {
    const data = await res.json();
    if (data && data[0] && data[0].value) { _cachedAnthropicKey = data[0].value; return _cachedAnthropicKey; }
  }
  throw new Error('AI generation is temporarily unavailable. Please contact the administrator.');
}

let _cachedDeepgramKey = null;
async function getDeepgramKey() {
  if (_cachedDeepgramKey) return _cachedDeepgramKey;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/app_config?key=eq.deepgram_api_key&select=value`, {

  });

}

// Default text is a plain copy of sim_control.html's own PATIENT_VOICE_PROMPT
// / PATIENT_VOICE_CONFUSED_NOTE defaults — see the loadSimConfig() override
// above for why both files can still stay in sync via the admin config even
// though the JS text itself is duplicated. Keep in sync by hand if the
// default wording ever changes in sim_control.html.
let PATIENT_VOICE_PROMPT = "You are voicing the PATIENT in a paramedic training scenario, answering a question the crew just asked out loud. Reply only as the patient would speak — first person, in character, brief (1-3 short sentences), plain lay language, no clinical terms the patient wouldn't use.\n\nOnly say what this patient could plausibly know or perceive themselves (their own symptoms, feelings, what happened to them, basic personal details) — never reveal the provisional diagnosis, clinical reasoning, vital sign numbers, or anything a real patient wouldn't know or say. If asked something the patient wouldn't know or that's irrelevant to them, answer in character as a confused/unsure patient would.\n\nLet their current condition colour HOW they answer: e.g. short of breath = short, breathless sentences; distressed/in pain = anxious tone. Never break character, never mention this being a simulation.\n\nYour name is {{patientName}}. If asked your name, or anything requiring you to refer to yourself, you MUST use this exact name — never invent or substitute a different one.\n{{confusedNote}}\n\nReturn ONLY the spoken reply text — no quotation marks, no stage directions, no prose about the answer.";
let PATIENT_VOICE_CONFUSED_NOTE = "This patient’s GCS Verbal score is 4 (confused conversation) — they are disoriented. Every reply must be rambling, tangential, and only loosely connected to what was actually asked (may drift to an unrelated memory, misidentify the crew, or answer a different question than the one asked) — never a clear, accurate, on-topic answer, no matter what is asked.";

// --- Deepgram TTS (Aura-2) voice selection ---------------------------
// Same per-scenario-stable pick as piperVoiceIdFor() (hashStr(seed +
// ':voice') % pool.length, seeded off avatarBuild.voiceSeed) — deliberately
// a DIFFERENT hash suffix and a different namespace of IDs than
// PIPER_VOICE_POOL, since Aura-2's model names (format
// "aura-2-<voicename>-<language>", e.g. "aura-2-thalia-en") are a
// completely separate catalogue from Piper's. Every one of the 41 names
// below is Deepgram's OWN complete "Aura-2: All Available English Voices"
// table (transcribed directly from their docs page, not summarized/
// guessed), split by their own "Expressed Gender" column
// (feminine/masculine -> our female/male buckets) — every en-* accent
// they list (American, British, Australian, Filipino) is included, not
// filtered down to American-only. Only two demographic buckets for now
// (matching what patientGender already gives us) — a finer age-aware pick
// (matching how the avatar's ageRamp() already varies pediatric/elderly
// appearance) is a natural follow-up, via avatarBuild.ageYears the same
// way youthVoiceRate() reads it; Deepgram's own "Age" column (Young
// Adult/Adult/Mature) would map onto that nicely whenever this gets built.
let DEEPGRAM_TTS_VOICE_POOL = {
  male: [
    'aura-2-apollo-en', 'aura-2-arcas-en', 'aura-2-aries-en', 'aura-2-atlas-en',
    'aura-2-draco-en', 'aura-2-hermes-en', 'aura-2-hyperion-en', 'aura-2-jupiter-en',
    'aura-2-mars-en', 'aura-2-neptune-en', 'aura-2-odysseus-en', 'aura-2-orion-en',
    'aura-2-orpheus-en', 'aura-2-pluto-en', 'aura-2-saturn-en', 'aura-2-zeus-en'
  ],
  female: [
    'aura-2-amalthea-en', 'aura-2-andromeda-en', 'aura-2-asteria-en', 'aura-2-athena-en',
    'aura-2-aurora-en', 'aura-2-callista-en', 'aura-2-cora-en', 'aura-2-cordelia-en',
    'aura-2-delia-en', 'aura-2-electra-en', 'aura-2-harmonia-en', 'aura-2-helena-en',
    'aura-2-hera-en', 'aura-2-iris-en', 'aura-2-janus-en', 'aura-2-juno-en',
    'aura-2-luna-en', 'aura-2-minerva-en', 'aura-2-ophelia-en', 'aura-2-pandora-en',
    'aura-2-phoebe-en', 'aura-2-selene-en', 'aura-2-thalia-en', 'aura-2-theia-en',
    'aura-2-vesta-en'
  ],
};
function deepgramVoiceIdFor(gender) {
  const pool = DEEPGRAM_TTS_VOICE_POOL[gender] || DEEPGRAM_TTS_VOICE_POOL.male;
  const seed = avatarBuild.voiceSeed || sessionCode || 'default';
  return pool[hashStr(seed + ':deepgram-tts-voice') % pool.length];
}

// --- Toggle ------------------------------------------------------------
const RT_VOICE_LS_KEY = 'av_rt_voice_enabled';
// Whether this browser can actually run the capture half of realtime mode —
// see startRealtimeCapture()'s own MediaRecorder gate, which is what
// ultimately refuses. Checked here too so the default below and the topbar
// hint agree with it.
function rtVoiceSupported() {
  return !!(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('audio/webm;codecs=opus'));
}
// Default ON — but only where it can work. An explicit stored '1'/'0' (i.e.
// the student has touched the tickbox) always wins; with no key set at all,
// the default resolves to on for Chrome-class browsers and off elsewhere, so
// an iPad/Safari user's first "Talk to Patient" tap still lands in the legacy
// tap-to-talk flow rather than a "needs Chrome" dead end.
let _rtVoiceEnabled = localStorage.getItem(RT_VOICE_LS_KEY) === null
  ? rtVoiceSupported()
  : localStorage.getItem(RT_VOICE_LS_KEY) === '1';
function setRtVoiceEnabled(enabled) {
  _rtVoiceEnabled = !!enabled;
  localStorage.setItem(RT_VOICE_LS_KEY, _rtVoiceEnabled ? '1' : '0');
  document.getElementById('rt-voice-checkbox').checked = _rtVoiceEnabled;
  updateRtVoiceStatusLabel();
  if (!_rtVoiceEnabled && _rtActive) endRealtimeCall(); // switching off mid-call tears the live call down too
}
function updateRtVoiceStatusLabel() {
  const el = document.getElementById('rt-voice-status');
  if (!el) return;
  el.textContent = _rtVoiceEnabled && !rtVoiceSupported() ? '(needs Chrome)' : '';
}

// Same unlock trick as unlockPiperAudio() (see its comment above) —
// Safari/iOS require play() to happen synchronously inside a real user
// gesture, and the actual Deepgram Aura-2 audio only becomes available
// later from an async fetch. Reuses the same primed-<audio>-element pattern with its
// own element (not _piperAudioEl) — the two TTS paths never run
// concurrently, but keeping them distinct avoids any chance of one
// clobbering the other's src mid-flight.
let _rtAudioEl = null;
let _rtAudioUnlocked = false;
function unlockRealtimeAudio() {
  if (_rtAudioUnlocked) return;
  _rtAudioUnlocked = true;
  try {
    _rtAudioEl = new Audio(SILENT_WAV_DATA_URI);
    _rtAudioEl.play().catch(() => {}); // best-effort — a rejection here just means the real reply falls back to text-only display later
  } catch (e) { /* best-effort unlock only */ }
}

// "Now listening" chime -----------------------------------------------------
// The gap between tapping Talk and startRealtimeCapture()'s socket.onopen
// (Deepgram key fetch, then getUserMedia permission, then the WS handshake
// itself) is real and can run a second or more — genuinely necessary setup,
// not something to eliminate, but silent, so anything said into that gap
// went uncaptured with no cue why. A short two-tone chime fired at the exact
// moment the socket actually opens (see socket.onopen below) marks "now" the
// same way a phone's own dial-tone-then-beep does, instead of relying on the
// status text alone.
//
// A real <audio> element playing REALTIME_READY_CHIME_WAV_DATA_URI (see its
// own comment), not a Web Audio oscillator — a first version used
// AudioContext + createOscillator(), which never produced audible sound in
// practice on iOS Safari (this tool's primary device) even after moving its
// resume() call into the tap handler where WebKit requires it. Same
// unlock-in-the-tap-handler pattern as unlockRealtimeAudio()/
// unlockPiperAudio() just above instead — created and played (silently,
// via SILENT_WAV_DATA_URI) here in startRealtimeCall(), then the SAME
// element gets its src swapped to the real chime and played again later
// from socket.onopen, which is the exact mechanism already proven to carry
// an unlock across into an async callback for real patient-voice playback.
let _rtChimeAudioEl = null;
let _rtChimeUnlocked = false;
function unlockRealtimeChime() {
  if (_rtChimeUnlocked) return;
  _rtChimeUnlocked = true;
  try {
    _rtChimeAudioEl = new Audio(SILENT_WAV_DATA_URI);
    _rtChimeAudioEl.play().catch(() => {}); // best-effort — a rejection here just means the chime silently doesn't play later
  } catch (e) { /* best-effort only — a missing chime isn't fatal */ }
}
// Two independent attempts, not one, because the two mainstream mobile
// browsers unlock autoplay by different rules and this needs to work on
// both: WebKit (iOS Safari) ties the unlock to the SPECIFIC element that
// played inside the gesture — reusing _rtChimeAudioEl (see
// unlockRealtimeChime()) covers that. Chrome instead unlocks at the PAGE
// level — once any gesture has triggered media playback anywhere on the
// tab, a brand new element's play() is allowed too — so the fallback below
// constructs a fresh Audio() rather than assuming the reuse trick above is
// the only thing that can work. Only reported broken on Android Chrome so
// far (see git history), where the reused-element path apparently isn't
// enough on its own; kept the original path first rather than replacing it
// since Safari genuinely does need it.
function playRealtimeReadyChime() {
  const tryPlay = (el) => { el.volume = 0.6; return el.play(); }; // quiet-ish — it shouldn't compete with the patient reply that usually follows within a second or two
  try {
    if (_rtChimeAudioEl) {
      _rtChimeAudioEl.src = REALTIME_READY_CHIME_WAV_DATA_URI;
      tryPlay(_rtChimeAudioEl).catch(() => {
        try { tryPlay(new Audio(REALTIME_READY_CHIME_WAV_DATA_URI)).catch(() => {}); } catch (e) { /* best-effort only */ }
      });
    } else {
      tryPlay(new Audio(REALTIME_READY_CHIME_WAV_DATA_URI)).catch(() => {});
    }
  } catch (e) { /* best-effort only */ }
}

// --- Live call lifecycle ------------------------------------------------
let _rtActive = false;
let _rtCallId = 0; // bumped on every start/end — every async callback checks this before touching shared state, so a stale call (ended or superseded) can't act after the fact
let _rtSocket = null;
let _rtRecorder = null;
let _rtStream = null;
let _rtSpeaking = false; // true while the Deepgram Aura-2 reply audio is actually playing — gates whether a SpeechStarted VAD event counts as a barge-in
let _rtPendingText = ''; // accumulated is_final fragments since the last speech_final

// --- Barge-in tuning (see startRealtimeCapture()'s SpeechStarted handler
// and speakRealtimeReply() for how these are used) ------------------------
// The mic stays live throughout playback now (an earlier version paused it
// entirely to eliminate a real echo-triggered false-cutoff bug — see git
// history — which worked but made genuine interruption impossible). This
// re-enables it with two mitigations real voice-agent platforms (LiveKit
// Agents, Pipecat) use for exactly this problem, since browser echo
// cancellation alone wasn't enough:
// - GRACE_MS: ignore SpeechStarted entirely for this long after a reply
//   starts playing. Acoustic echo cancellation is an ADAPTIVE filter — it
//   needs a moment to learn the room/speaker/mic echo path, and is weakest
//   in exactly this opening window, which is exactly when the original bug
//   fired (cut off after 1-2 words = VAD reacting before AEC converged).
// - CONFIRM_MS: past the grace period, a SpeechStarted only ARMS a
//   possible barge-in — it does NOT cut the audio by itself. The cut only
//   happens if real transcribed text actually follows within this window;
//   a bare VAD blip with nothing behind it is treated as an AEC residual/
//   noise false-positive and ignored, audio keeps playing.
// Untested against real echo/hardware — these numbers are a reasonable
// starting point, not a validated tuning. If false cutoffs return, try
// raising GRACE_MS first (that's the more likely culprit); if genuine
// interruptions feel sluggish to register, lower CONFIRM_MS.
const BARGE_IN_GRACE_MS = 600;
const BARGE_IN_CONFIRM_MS = 600;
let _rtPlaybackStartedAt = 0; // Date.now() when _rtSpeaking last became true — grace period is measured from here
let _rtBargeInArmedAt = null; // Date.now() a SpeechStarted armed a possible barge-in, or null if none pending

// Set once the student has tapped Talk's red X to close the mic while a
// reply is still finishing playback — see requestEndRealtimeCall(). Kept
// separate from _rtActive (which stays true until the reply actually
// finishes and the call is torn down) specifically so isFabArmed() can flip
// the button back to idle THE INSTANT the mic closes, without waiting for
// however much longer the current sentence has left to play.
let _rtMicClosed = false;

// The voice modal panel (status/transcript/patient reply) is deliberately
// NOT opened here — see revealRealtimeModal()/showRealtimeConnectingIndicator()
// below. Opening it immediately, with nothing but a static "Connecting…"
// line in it, used to read as the mic already being live before it
// actually was (the real setup gap — key fetch, mic permission, WS
// handshake — is covered in detail over startRealtimeCapture()). A small
// spinner on the avatar's own mic badge stands in for that instead, and the
// panel itself only appears once startRealtimeCapture() actually knows
// whether it succeeded or failed.
function startRealtimeCall() {
  if (_patientDisplayMode === 'monitor') return; // this device's mic is intentionally never used in Monitor Only mode — see setDisplayMode()
  unlockSpeechSynthesis(); // the TTS-failure fallback in speakRealtimeReply() still needs this unlocked
  unlockRealtimeAudio(); // must happen here, inside the tap handler, to count as a user gesture
  unlockRealtimeChime(); // same reason — see its own comment
  stopWakeListening();
  hideWakePanel();
  // The other direction of the same overlap guarded in
  // maybeSaySpontaneousLine(): an ambient line that started a moment before
  // this tap is still playing through the legacy Piper/Web Speech path, and
  // nothing else would cut it off — the realtime call would just start
  // talking over the top of it in a different voice. Same helper the legacy
  // path already uses on itself for exactly this ("talking over himself" —
  // see stopAnyPatientAudio()'s own comment).
  stopAnyPatientAudio();
  _rtCallId++;
  _rtActive = true;
  _rtMicClosed = false;
  showRealtimeConnectingIndicator();
  startRealtimeCapture();
  syncFabArmedUI();
}

// See startRealtimeCall()'s comment. Reuses #voice-mic-indicator — the same
// floating badge that shows the red "listening" mic once connected — for a
// spinner instead, rather than adding a whole separate loading element:
// they're mutually exclusive states of the one "is my mic doing anything
// right now" cue, so sharing its position keeps that obvious at a glance.
function showRealtimeConnectingIndicator() {
  document.getElementById('voice-mic-indicator').classList.add('connecting');
}
function hideRealtimeConnectingIndicator() {
  document.getElementById('voice-mic-indicator').classList.remove('connecting');
}

// Reveals the voice modal panel — called exactly once per call attempt,
// either from socket.onopen on success or from one of
// startRealtimeCapture()'s earlier failure branches (unsupported browser /
// key fetch failed / mic permission denied / connect timeout), so whichever
// status text that branch sets is actually visible instead of being
// written into a still-hidden panel.
function revealRealtimeModal() {
  hideRealtimeConnectingIndicator();
  openVoiceModal('chat', { skipCapture: true }); // reuses the shared modal shell; skipCapture=true means it does NOT also start legacy SpeechRecognition
  document.getElementById('voice-modal-title').textContent = '⚡ Realtime Voice';
}

// The "closes mic, lets the patient finish whatever they were saying" half
// of the Talk button's second tap — the mic/socket close IMMEDIATELY (no
// more of the student's speech is captured), but if a reply is actively
// playing, the call isn't torn down (and the panel doesn't close) until
// that finishes naturally: cutting speakRealtimeReply()'s audio off
// mid-sentence just because the student tapped Stop would be a worse
// experience than a mic that's already stopped listening. Listens on
// _rtAudioEl directly (once, alongside whatever speakRealtimeReply() itself
// already has hooked into 'ended'/'onpause') rather than polling
// _rtSpeaking, so this fires in the same synchronous dispatch as that
// resolution instead of up to one poll-interval late.
function requestEndRealtimeCall() {
  if (!_rtActive || _rtMicClosed) return;
  const callId = _rtCallId;
  stopRealtimeCapture();
  _rtMicClosed = true;
  syncFabArmedUI();
  const finish = () => { if (callId === _rtCallId) closeVoiceModal(); };
  if (_rtSpeaking && _rtAudioEl) {
    _rtAudioEl.addEventListener('ended', finish, { once: true });
    _rtAudioEl.addEventListener('pause', finish, { once: true });
    document.getElementById('voice-modal-status').textContent = 'Mic closed — finishing reply…';
  } else {
    finish();
  }
}

// Mic/socket teardown only — factored out of endRealtimeCall() so
// requestEndRealtimeCall() above can stop capturing immediately without
// also cutting a reply that's still playing (see its own comment).
function stopRealtimeCapture() {
  if (_rtSocket) { try { _rtSocket.close(); } catch (e) {} _rtSocket = null; }
  if (_rtRecorder) { try { _rtRecorder.stop(); } catch (e) {} _rtRecorder = null; }
  if (_rtStream) { _rtStream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} }); _rtStream = null; }
  document.getElementById('voice-mic-indicator').classList.remove('listening');
  hideRealtimeConnectingIndicator(); // covers Stop being tapped mid-connect, before socket.onopen/a failure branch ever got to reveal the modal and clear this itself
}

function endRealtimeCall() {
  _rtActive = false;
  _rtMicClosed = false;
  _rtCallId++; // invalidates any in-flight async work from this call
  stopRealtimeCapture();
  stopRealtimeAudio();
  _rtPendingText = '';
}

function stopRealtimeAudio() {
  _rtSpeaking = false;
  _rtBargeInArmedAt = null; // any pending barge-in arm/confirm cycle ends with the audio it was about
  if (_rtAudioEl) { try { _rtAudioEl.pause(); } catch (e) {} }
  stopTalkAnimation();
}

// --- STT: Deepgram streaming ---------------------------------------------
// Browsers can't set an Authorization header on a WebSocket handshake, so
// the API key travels as a Sec-WebSocket-Protocol subprotocol instead —
// Deepgram's own documented browser auth method (`new WebSocket(url,
// ['token', apiKey])`), not a workaround improvised here. No `encoding`
// query param: MediaRecorder's webm/opus output is a self-describing
// container Deepgram auto-detects, per their browser streaming examples —
// if transcripts come back empty during testing, an explicit
// encoding=opus&sample_rate=... pair is the first thing to try adding.
// vad_events=true is what makes barge-in possible at all — see onmessage's
// SpeechStarted branch below.
async function startRealtimeCapture() {
  const callId = _rtCallId;
  const statusEl = document.getElementById('voice-modal-status');
  const transcriptEl = document.getElementById('voice-modal-transcript');
  if (!(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('audio/webm;codecs=opus'))) {
    revealRealtimeModal();
    statusEl.textContent = 'Realtime Voice needs Chrome (MediaRecorder isn’t available here).';
    return;
  }
  // No "Connecting…" status set here — the panel itself stays hidden this
  // whole stretch (see revealRealtimeModal()/showRealtimeConnectingIndicator()
  // above), so there's nothing to show it to yet.
  let dgKey;
  try { dgKey = await getDeepgramKey(); }
  catch (e) { if (callId === _rtCallId) { revealRealtimeModal(); statusEl.textContent = e.message; } return; }
  if (callId !== _rtCallId) return; // call ended/superseded while the key fetch was in flight

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch (e) {
    if (callId === _rtCallId) { revealRealtimeModal(); statusEl.textContent = 'Microphone permission is required for Realtime Voice.'; }
    return;
  }
  if (callId !== _rtCallId) { stream.getTracks().forEach(t => t.stop()); return; }
  _rtStream = stream;

  const dgUrl = 'wss://api.deepgram.com/v1/listen?model=nova-3&smart_format=true&punctuate=true&interim_results=true&endpointing=300&vad_events=true&language=en-US';
  const socket = new WebSocket(dgUrl, ['token', dgKey]);
  _rtSocket = socket;

  // Connect timeout: a WebSocket handshake that a network security layer is
  // silently swallowing (rather than cleanly rejecting) never fires onopen,
  // onerror, OR onclose — it just hangs forever, which is indistinguishable
  // from "still connecting" without a timer of our own. Confirmed happening
  // in the wild: a managed device running Microsoft Defender for Endpoint's
  // content filter hit this exact hang on BOTH this page and Deepgram's own
  // Playground, on every network tried (device-level filter, not
  // network-specific) — see git history around this comment for the
  // investigation. Chrome (MediaRecorder) already gates entry above, so
  // getting this far means the browser itself is fine; a hang past this
  // point is a network/security-policy problem outside this page's control,
  // and the least this code can do is say so instead of imitating the same
  // silent hang Deepgram's own product shows in that situation.
  const RT_CONNECT_TIMEOUT_MS = 8000;
  const connectTimer = setTimeout(() => {
    if (callId !== _rtCallId) return;
    try { socket.close(); } catch (e) {}
    revealRealtimeModal();
    statusEl.textContent = 'Couldn’t connect (timed out) — this can happen on networks with security filtering that blocks realtime voice traffic. Try Standard Voice instead, or check with IT if this keeps happening.';
  }, RT_CONNECT_TIMEOUT_MS);

  socket.onopen = () => {
    clearTimeout(connectTimer);
    if (callId !== _rtCallId) { try { socket.close(); } catch (e) {} return; }
    revealRealtimeModal();
    statusEl.textContent = 'Listening… (you can interrupt anytime)';
    document.getElementById('voice-mic-indicator').classList.add('listening'); // same red badge legacy hold-to-talk uses — removed in stopRealtimeCapture()
    playRealtimeReadyChime(); // the setup gap above (key fetch, mic permission, WS handshake) just ended — this is the actual "you can talk now" instant
    const recorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
    _rtRecorder = recorder;
    recorder.ondataavailable = (ev) => {
      if (ev.data && ev.data.size > 0 && socket.readyState === WebSocket.OPEN) socket.send(ev.data);
    };
    recorder.start(250); // ~250ms chunks — small enough for low latency, large enough not to spam the socket
  };

  socket.onmessage = (ev) => {
    if (callId !== _rtCallId) return;
    let msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    if (msg.type === 'SpeechStarted') {
      // Not a cut by itself — see the "Barge-in tuning" comment above
      // _rtBargeInArmedAt. Outside playback (!_rtSpeaking) there's nothing
      // to interrupt, so this is a no-op then. During the grace window
      // (playback just started, AEC hasn't converged yet) it's ignored
      // outright. Otherwise it ARMS — the actual cut happens below, in the
      // Results branch, only if real transcribed text follows within
      // BARGE_IN_CONFIRM_MS.
      if (_rtSpeaking && !_rtBargeInArmedAt && (Date.now() - _rtPlaybackStartedAt) > BARGE_IN_GRACE_MS) {
        _rtBargeInArmedAt = Date.now();
      }
      return;
    }
    if (msg.type !== 'Results') return;
    const alt = msg.channel && msg.channel.alternatives && msg.channel.alternatives[0];
    const text = (alt && alt.transcript) || '';
    if (_rtBargeInArmedAt) {
      if (Date.now() - _rtBargeInArmedAt > BARGE_IN_CONFIRM_MS) {
        _rtBargeInArmedAt = null; // confirmation window expired with nothing behind it — AEC residual/noise, false alarm, keep playing
      } else if (text) {
        _rtBargeInArmedAt = null;
        stopRealtimeAudio(); // confirmed — real transcribed speech followed the VAD trigger, treat as a genuine interruption
      }
    }
    // is_final and speech_final are independent flags — a message can be
    // is_final (this fragment's words are locked in) without speech_final
    // (more speech is still coming), and Deepgram often sends the actual
    // speech_final:true signal on a LATER message with an EMPTY transcript
    // (pure silence/endpoint detection) — so the "send it to the AI" check
    // below deliberately does not require THIS message to carry text.
    if (msg.is_final && text) {
      _rtPendingText = (_rtPendingText + ' ' + text).trim();
      transcriptEl.textContent = _rtPendingText;
    } else if (!msg.is_final && text) {
      transcriptEl.textContent = (_rtPendingText + ' ' + text).trim();
    }
    if (msg.speech_final) {
      const finalText = _rtPendingText;
      _rtPendingText = '';
      if (finalText) handleRealtimeUtterance(finalText, callId);
    }
  };

  socket.onerror = () => {
    clearTimeout(connectTimer);
    if (callId === _rtCallId) statusEl.textContent = 'Connection error — check the network and try again.';
  };
  socket.onclose = () => {
    clearTimeout(connectTimer);
    /* otherwise no-op — endRealtimeCall() is the only place that tears state down; a server-initiated close just leaves the modal showing whatever status was last set */
  };
}

// --- One question/answer exchange -----------------------------------------
async function handleRealtimeUtterance(text, callId) {
  if (!text || callId !== _rtCallId) return;
  const statusEl = document.getElementById('voice-modal-status');
  const replyEl = document.getElementById('patient-reply-display');
  statusEl.textContent = 'Thinking…';
  let reply;
  try {
    reply = await generateRealtimePatientReply(text);
  } catch (e) {
    reply = "...sorry, I didn't catch that.";
  }
  if (callId !== _rtCallId) return; // call ended/superseded while the AI call was in flight
  if (!reply) {
    // GCS V<=1 — no verbal response at all, same as the legacy path.
    statusEl.textContent = 'Listening… (you can interrupt anytime)';
    return;
  }
  statusEl.textContent = 'Patient replied:';
  replyEl.textContent = `“${reply}”`;
  replyEl.style.display = 'block';
  // Fire-and-forget audit write — see the "Trade-offs" comment at the top
  // of this section on why this doesn't reach the assessor's Log tab yet.
  sbPatch(`sim_sessions?session_code=eq.${encodeURIComponent(sessionCode)}`, {
    patient_reply: { id: Date.now(), forId: null, text: reply, speak: true },
    updated_at: new Date().toISOString()
  }).catch(() => {});
  await speakRealtimeReply(reply, callId);
  if (callId !== _rtCallId) return;
  statusEl.textContent = 'Listening… (you can interrupt anytime)';
  replyEl.style.display = 'none';
}

// Same GCS-verbal tiering as sim_control.html's answerPatientQuestion() —
// V<=1 no reply, V2/V3 canned sounds/fragments (no AI call), V4/V5 genuine
// reasoning. Kept in sync by hand (see the comment on PATIENT_VOICE_PROMPT
// above) rather than shared, since sim_control.html's version is entangled
// with its own actionLog/Supabase-write side effects this path doesn't
// have. Returns null for "no verbal response" (V<=1) so the caller can
// distinguish that from a real (possibly canned) reply string.
async function generateRealtimePatientReply(question) {
  const v = SimEngine.getVitalsRaw(testConfig, SimEngine.getSimNow(testConfig, Date.now()));
  const gcsV = Math.round(v.gcsV || 0);
  if (gcsV <= 1) return null;
  if (gcsV === 2) return SimEngine.GCS_V2_SOUNDS[Math.floor(Math.random() * SimEngine.GCS_V2_SOUNDS.length)];
  if (gcsV === 3) return SimEngine.GCS_V3_WORDS[Math.floor(Math.random() * SimEngine.GCS_V3_WORDS.length)];

  const apiKey = await getAnthropicKey();
  const patientName = (scenarioMeta && scenarioMeta.patient_meta && scenarioMeta.patient_meta.name) || 'the patient';
  const confused = gcsV === 4;
  const confusedNote = confused ? ('\n' + PATIENT_VOICE_CONFUSED_NOTE) : '';
  const systemPrompt = PATIENT_VOICE_PROMPT.replace(/\{\{patientName\}\}/g, patientName).replace(/\{\{confusedNote\}\}/g, confusedNote);
  // Simplified inline equivalent of sim_control.html's currentDateTimeContext().
  const nowStr = new Date().toLocaleString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const treatmentsList = (testConfig.treatments || []).map(t => t.action).join('; ');
  const userPrompt = `Current real-world date/time: ${nowStr} — use this if the crew asks an orientation question ("do you know what day it is?" etc), otherwise it's just background context.
Scenario: ${(scenarioMeta && scenarioMeta.title) || ''}
Patient name: ${patientName}
Provisional diagnosis (do not reveal): ${(scenarioMeta && scenarioMeta.provisional) || 'unspecified'}
Key history: ${(scenarioMeta && scenarioMeta.key_hx) || ''}
Current approximate condition: HR ${v.HR}, RR ${v.RR}, SpO2 ${v.SpO2}%, GCS ${(v.gcsE||0)+(v.gcsV||0)+(v.gcsM||0)}/15 (Verbal component: ${gcsV}/5), pain ${v.pain != null ? v.pain + '/10' : 'unspecified'}
Treatments given so far: ${treatmentsList || 'none yet'}

The crew just asked/said: "${question}"

Reply as the patient.`;
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
    // max_tokens tightened from 300 -> 120 as a latency lever, not just a
    // safety cap: this call isn't streamed (see the "Trade-offs" comment
    // above), so nothing plays until the FULL completion lands — every
    // token Haiku is allowed to generate is added wait time, not just a
    // worst-case ceiling. 120 is still comfortable headroom over what the
    // prompt actually asks for ("1-3 short sentences" is realistically
    // 60-80 tokens), so this shouldn't visibly truncate real replies, only
    // cut off the rare runaway completion faster.
    body: JSON.stringify({ model: 'claude-haiku-4-5-20251001', max_tokens: 120, system: systemPrompt, messages: [{ role: 'user', content: userPrompt }] })
  });
  if (!response.ok) throw new Error(`Anthropic call failed (${response.status})`);
  const data = await response.json();
  const text = (data.content || []).map(b => b.text || '').join('').trim();
  return text || "...sorry, I didn't catch that.";
}

// --- TTS: Deepgram Aura-2 ---------------------------------------------------
// Fetches the FULL audio before playing (see the "Trade-offs" comment at
// the top of this section) — a single POST to /v1/speak, played through
// the element unlockRealtimeAudio() already primed inside a real tap.
// Unlike the STT WebSocket above, this is a plain REST POST, so the API
// key travels as a normal Authorization header (`Token <key>`, Deepgram's
// own convention — NOT `Bearer`) rather than needing the
// Sec-WebSocket-Protocol trick. model/encoding are query-string
// parameters (Deepgram's documented pattern, e.g.
// "?model=aura-2-thalia-en&encoding=mp3"), NOT JSON body fields — only
// `text` goes in the body. mp3 is the REST endpoint's own default encoding,
// requested explicitly here anyway for clarity/future-proofing. Falls back
// to speakPatientReply()'s existing Piper-then-Web-Speech chain on any
// failure (missing key, network error, bad voice name) rather than leaving
// the reply silent — same "never leave the training exercise stuck"
// principle the legacy path already follows.
async function speakRealtimeReply(text, callId) {
  try {
    const apiKey = await getDeepgramKey();
    if (callId !== _rtCallId) return;
    const voiceModel = deepgramVoiceIdFor(patientGender);
    const res = await fetch(`https://api.deepgram.com/v1/speak?model=${encodeURIComponent(voiceModel)}&encoding=mp3`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Token ${apiKey}`
      },
      body: JSON.stringify({ text })
    });
    if (!res.ok) throw new Error(`Deepgram TTS call failed (${res.status})`);
    if (callId !== _rtCallId) return;

    // Adopted as _rtAudioEl rather than kept local when the unlock never ran:
    // stopRealtimeAudio(), requestEndRealtimeCall() and the barge-in path all
    // reach for _rtAudioEl by name, so a purely local element here would keep
    // playing through every one of them — including this function's own catch
    // below, which stops "the" audio and then speaks the same line again
    // through the fallback voice, i.e. the reply audible twice at once in two
    // different voices.
    if (!_rtAudioEl) _rtAudioEl = new Audio();
    const audio = _rtAudioEl;
    // Stream via MediaSource where possible — see playStreamedMp3() for why
    // this is the actual latency win over the old res.blob()-then-play
    // approach (audio starts on the FIRST chunk instead of the whole file).
    // Chrome has supported MP3 in MSE for years and this feature is already
    // Chrome-only (see the MediaRecorder gate in startRealtimeCapture()), so
    // this should always be true in practice — checked explicitly anyway
    // rather than assumed, with a safety-net fallback to the old behaviour.
    if (window.MediaSource && MediaSource.isTypeSupported('audio/mpeg') && res.body) {
      await playStreamedMp3(audio, res.body, callId);
    } else {
      const blob = await res.blob();
      if (callId !== _rtCallId) return;
      audio.src = URL.createObjectURL(blob);
      _rtSpeaking = true;
      _rtPlaybackStartedAt = Date.now();
      _rtBargeInArmedAt = null;
      await new Promise((resolve, reject) => {
        // onpause (not just onended) matters here: stopRealtimeAudio() calls
        // audio.pause() directly on a confirmed barge-in, which does NOT
        // fire 'ended' — without this, that path left this promise (and the
        // handleRealtimeUtterance() call awaiting it) permanently hanging,
        // silently skipping its own status-reset tail. Real bug, found while
        // touching this code for the streaming rewrite below, not a
        // hypothetical — see git history for the fuller story.
        audio.onended = resolve;
        audio.onpause = resolve;
        audio.onerror = () => reject(new Error('Deepgram TTS audio playback error'));
        audio.play().then(startTalkAnimation).catch(reject);
      });
    }
    if (callId === _rtCallId) stopRealtimeAudio(); // clears _rtSpeaking, stops talk animation — harmless no-op if a barge-in already called this
  } catch (e) {
    stopRealtimeAudio();
    if (callId !== _rtCallId) return;
    // Fall back to the legacy Piper/Web Speech chain — isConversation=false
    // and a no-op resume since this call site drives its own loop
    // (handleRealtimeUtterance), not speakPatientReply()'s.
    await speakPatientReply(text, () => {}, false, hqVoiceEnabled);
  }
}

// Pipes a streamed Deepgram Aura-2 MP3 response into <audio> via MediaSource
// Extensions, so playback can start on the FIRST chunk instead of waiting
// for res.blob() to collect the entire file — the actual fix for "responses
// feel slow", since the old approach silently waited out the full TTS
// synthesis + download before a single sound played. Resolves once playback
// ends (natural completion OR a pause — see the onpause comment in
// speakRealtimeReply()) so the caller doesn't need to know which path this
// function's caller took.
function playStreamedMp3(audio, body, callId) {
  let sourceBuffer;
  let startedPlayback = false;

  function appendChunk(chunk) {
    return new Promise((resolve, reject) => {
      const onUpdateEnd = () => { sourceBuffer.removeEventListener('updateend', onUpdateEnd); resolve(); };
      sourceBuffer.addEventListener('updateend', onUpdateEnd);
      try { sourceBuffer.appendBuffer(chunk); } catch (e) { reject(e); }
    });
  }

  return new Promise((resolve, reject) => {
    const mediaSource = new MediaSource();
    audio.src = URL.createObjectURL(mediaSource);
    audio.onended = resolve;
    audio.onpause = resolve; // see speakRealtimeReply()'s comment on why this matters as much as onended
    audio.onerror = () => reject(new Error('Deepgram TTS audio playback error'));

    mediaSource.addEventListener('sourceopen', async () => {
      if (callId !== _rtCallId) { resolve(); return; }
      try {
        sourceBuffer = mediaSource.addSourceBuffer('audio/mpeg');
        const reader = body.getReader();
        while (true) {
          // Stop feeding the buffer once this call has ended OR this specific
          // reply was cut off by a confirmed barge-in — stopRealtimeAudio()
          // clears _rtSpeaking on both a real interruption and a normal
          // completion, checked here only once playback has actually
          // started (it's legitimately still false during the brief window
          // before the first chunk arrives, which isn't a stop signal).
          if (callId !== _rtCallId || (startedPlayback && !_rtSpeaking)) {
            reader.cancel().catch(() => {});
            resolve();
            return;
          }
          const { done, value } = await reader.read();
          if (done) {
            if (mediaSource.readyState === 'open') { try { mediaSource.endOfStream(); } catch (e) {} }
            break;
          }
          await appendChunk(value);
          if (!startedPlayback) {
            // Don't wait for the rest of the file — enough is buffered to
            // start now, which is the entire point of streaming this.
            startedPlayback = true;
            _rtSpeaking = true;
            _rtPlaybackStartedAt = Date.now();
            _rtBargeInArmedAt = null;
            audio.play().then(startTalkAnimation).catch(reject);
          }
        }
      } catch (e) {
        reject(e);
      }
    });
  });
}

async function queueStudentItem(type, text) {
  const rows = await sbGet(`sim_sessions?session_code=eq.${encodeURIComponent(sessionCode)}&select=student_queue`);
  const queue = (rows[0] && rows[0].student_queue) || [];
  const id = Date.now();
  queue.push({ id, type, text });
  await sbPatch(`sim_sessions?session_code=eq.${encodeURIComponent(sessionCode)}`, { student_queue: queue, updated_at: new Date().toISOString() });
  return id;
}
