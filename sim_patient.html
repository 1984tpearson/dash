// --- Wake-word "auto-listen" ------------------------------------------------
// Opt-in continuous listening so a crew member doesn't have to hold one of
// the three fab buttons — see CLAUDE.md's "wake word" discussion for why
// this, not eye-tracking or a bare open mic. NOT a real hotword engine
// (browsers don't expose one): this just runs SpeechRecognition continuously
// and fuzzy-matches each final transcript against a small set of trigger
// phrases (see getWakeWords()) before treating anything after the matched
// phrase as that mode's content, queued through the exact same student_queue
// path (queueStudentItem) a manual press uses. Three modes, two different
// kinds of trigger:
// - 'chat' triggers on the patient's own first name — asking the patient
//   something is naturally addressed to them by name ("Dave, can you hear
//   me?"), so no new phrase to learn.
// - 'exam'/'treatment' trigger on a fixed lead-in phrase ("assessment"/
//   "treatment") instead, because those two are narrated to the team/
//   instructor, not spoken to the patient — there's no equivalent natural
//   "address by name" moment to hook, so this is a spoken stand-in for
//   holding the Assess/Treat button rather than something inferred from the
//   content itself (that would need an AI classification call, and this
//   page has no Anthropic key to make one — see CLAUDE.md's sim
//   architecture notes on why all AI calls live in sim_control.html).
// False positives from ordinary crew/student crosstalk that happens to
// contain one of these phrases are an accepted tradeoff of not requiring a
// button press — same class of risk any keyword-gated always-on mic has; a
// real wake-word engine wouldn't remove it either.
const WAKE_WORD_LS_KEY = 'av_wake_word_enabled';
let _wakeWordEnabled = localStorage.getItem(WAKE_WORD_LS_KEY) === '1';
let _wakeRecognition = null;
// Set once a wake phrase alone was heard with nothing following it (e.g.
// just "...Dave?" or "assessment—") — the NEXT final transcript within this
// window is taken as that phrase's content, without needing it repeated.
let _wakeArmedUntil = 0;
let _wakeArmedMode = null;
let _wakeArmedGreeting = false;
const WAKE_FOLLOWUP_MS = 7000;
// Synchronous guard against a second wake trigger firing while the first
// send is still in flight — matters most for 'treatment', which (unlike
// 'chat'/'exam') never sets _lastChatSentId, so nothing else would block a
// near-simultaneous second detection during the await below.
let _wakeSendInFlight = false;
// Bootstrap-only chat triggers ("hello"/"hey"/"hi there") for before the
// crew knows the patient's name yet — e.g. "hello, my name is Tim, what's
// your name?" One-shot: the first time any of these actually fires a wake
// item, this flips false for the rest of the session (see sendWakeItem) and
// stays off, since "hey"/"hello" are common enough in ordinary crew/student
// chatter that leaving them live all scenario would misfire constantly once
// they're no longer needed to break the ice.
let _greetingWakeWordsActive = true;

// Each entry's phrase triggers that entry's mode ('chat'/'exam'/'treatment'
// — same three types student_queue items already carry, see
// queueStudentItem()/processStudentQueue()). The patient's own name only
// makes sense as a trigger for 'chat' — asking the patient something is
// naturally addressed to them by name ("Dave, can you hear me?"), but an
// assessment or treatment action is narrated to the team/instructor, not
// spoken to the patient, so there's no equivalent natural "address by name"
// moment to hook for those two. 'assessment'/'treatment' work instead as a
// spoken equivalent of holding the Assess/Treat button — a fixed lead-in
// phrase, not a name — accepting that this is one more thing to learn/say
// than the chat trigger, same tradeoff already noted for the chat wake word:
// no better signal is available without an AI classification call this page
// has no Anthropic key to make (see CLAUDE.md's sim architecture notes).
// Order matters: checked top-to-bottom, first match wins, so a longer/more
// specific phrase must come before a shorter one it contains (e.g. 'hey
// patient' before the bare 'hey') or the shorter one would win and leave
// the specific one's tail ("patient") sitting in the extracted query text.
// Matched on WORD BOUNDARIES, never as a bare substring — see
// findWakePhrase(). A plain indexOf() made 'hey' fire on every "they" in
// ordinary crew talk ("so they are hypotensive now"), and short patient
// names were far worse: 'Ed' hit "checked"/"seemed"/"worried", 'Al' hit
// "also"/"already", 'Sam' hit "same". That alone would make auto-listen
// look like it was triggering at random.
function getWakeWords() {
  const name = scenarioMeta && scenarioMeta.patient_meta && scenarioMeta.patient_meta.name;
  const words = [];
  if (name) {
    const parts = String(name).trim().split(/\s+/).filter(Boolean);
    const first = (parts[0] || '').toLowerCase();
    // Full name before first name — longer/more specific wins, and it keeps
    // "Connor McDonald" from leaving "mcdonald" stranded in the query text.
    if (parts.length > 1) words.push({ phrase: parts.join(' ').toLowerCase(), mode: 'chat', name: true });
    if (first) words.push({ phrase: first, mode: 'chat', name: true });
  }
  words.push({ phrase: 'hey patient', mode: 'chat' }, { phrase: 'excuse me', mode: 'chat' });
  if (_greetingWakeWordsActive) {
    words.push(
      { phrase: 'hi there', mode: 'chat', greeting: true },
      { phrase: 'hello', mode: 'chat', greeting: true },
      { phrase: 'hey', mode: 'chat', greeting: true }
    );
  }
  words.push({ phrase: 'assessment', mode: 'exam' }, { phrase: 'assessing', mode: 'exam' });
  words.push({ phrase: 'treatment', mode: 'treatment' }, { phrase: 'administering', mode: 'treatment' });
  return words;
}

// Proper nouns are the weakest thing a speech recogniser handles, and it has
// no idea this scenario's patient is called Connor — doubled consonants in
// particular come back inconsistently ("Connor"/"Conor", "Emmett"/"Emet",
// "Aaliyah"/"Alia"). Collapsing runs of the same letter on BOTH sides makes
// those compare equal. Only applied to names 4+ characters long: at 2-3
// characters it starts matching ordinary words ("all" collapses to "al",
// "see" to "se"), which is exactly the false-positive class the word-boundary
// fix above existed to kill.
function normaliseNameToken(s) {
  const stripped = String(s).toLowerCase().replace(/[^a-z]/g, '');
  return stripped.length >= 4 ? stripped.replace(/(.)\1+/g, '$1') : stripped;
}

// Finds the first wake phrase present in `transcript` as a whole word (or
// whole multi-word run), returning the matched entry plus where its content
// starts. Word boundaries are built with an explicit non-letter lookaround
// rather than \b: a name could contain an apostrophe or hyphen, and \b would
// happily match mid-name at those. Returns null when nothing matched.
function findWakePhrase(transcript) {
  const lower = transcript.toLowerCase();
  for (const w of getWakeWords()) {
    if (w.name) {
      const hit = findNameToken(transcript, w.phrase);
      if (hit != null) return { entry: w, contentFrom: hit };
      continue;
    }
    const escaped = w.phrase.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp('(?:^|[^a-z0-9])' + escaped + '(?![a-z0-9])', 'i');
    const m = re.exec(lower);
    if (!m) continue;
    return { entry: w, contentFrom: m.index + m[0].length };
  }
  return null;
}

// Word-wise (not regex) scan for a name, so each transcript token can be
// compared through normaliseNameToken(). `namePhrase` may be multi-word (a
// full name), in which case consecutive tokens must all match in order.
// Returns the character index just past the matched run, or null.
function findNameToken(transcript, namePhrase) {
  const wanted = namePhrase.split(/\s+/).map(normaliseNameToken).filter(Boolean);
  if (!wanted.length) return null;
  const tokens = [];
  const re = /[A-Za-z'’-]+/g;
  let m;
  while ((m = re.exec(transcript))) tokens.push({ text: m[0], end: m.index + m[0].length });
  for (let i = 0; i + wanted.length <= tokens.length; i++) {
    let all = true;
    for (let j = 0; j < wanted.length; j++) {
      if (normaliseNameToken(tokens[i + j].text) !== wanted[j]) { all = false; break; }
    }
    if (all) return tokens[i + wanted.length - 1].end;
  }
  return null;
}

// --- Wake exchange panel ----------------------------------------------------
// A wake-word exchange happens with no button pressed and no modal open, so
// without this the only evidence anything was happening was the patient
// eventually talking — nothing showed that a trigger had been heard, that a
// reply was being generated, or what the reply actually said. Reuses the
// same #patient-info-voice panel the manual modal uses (identical layout,
// one place to maintain) but deliberately does NOT set _voiceModalOpen: that
// flag means "the student is mid-manual-exchange" and would both stop the
// wake mic and start the push-to-talk capture. The manual modal always wins
// if it opens — see openVoiceModal(), which cancels this outright.
//
// Showing the heard transcript is also the diagnostic surface for wake-word
// misfires: a name the recogniser mangles is invisible otherwise, but here
// it's on screen exactly as transcribed.
let _wakePanelActive = false;
let _wakePanelHideTimer = null;
let WAKE_PANEL_LINGER_MS = 6000;
// Per-mode wording for the in-flight state — "thinking" is only honest for
// chat; an exam finding is being looked up and a treatment is just being
// logged/applied, neither of which is the patient thinking about anything.
let WAKE_THINKING_STATUS = {
  chat: 'Patient is thinking',
  exam: 'Getting the finding',
  treatment: 'Sending to the assessor'
};

function showWakePanel(mode, opts) {
  if (_voiceModalOpen) return; // a real manual exchange owns the panel
  opts = opts || {};
  _wakePanelActive = true;
  if (_wakePanelHideTimer) { clearTimeout(_wakePanelHideTimer); _wakePanelHideTimer = null; }
  const titleEl = document.getElementById('voice-modal-title');
  const statusEl = document.getElementById('voice-modal-status');
  titleEl.textContent = VOICE_MODE_LABELS[mode] || mode;
  titleEl.classList.add('wake-badge');
  statusEl.textContent = opts.status || '';
  statusEl.classList.toggle('wake-hearing', opts.state === 'hearing');
  statusEl.classList.toggle('wake-thinking', opts.state === 'thinking');
  if (opts.heard !== undefined) document.getElementById('voice-modal-transcript').textContent = opts.heard;
  if (opts.clearReply) {
    const replyEl = document.getElementById('patient-reply-display');
    replyEl.style.display = 'none';
    replyEl.textContent = '';
  }
  document.getElementById('type-input-row').style.display = 'none'; // nothing to type into — this exchange is voice-driven by definition
  document.getElementById('patient-info-voice').classList.add('wake-auto');
  document.getElementById('patient-info-normal').style.display = 'none';
  document.getElementById('patient-info-voice').style.display = 'block';
  document.getElementById('patient-info').classList.add('voice-active'); // see the mobile Avatar Only rule in the CSS for why this exists
  document.getElementById('voice-mic-indicator').classList.toggle('listening', opts.state === 'hearing');
}

// Leaves the reply on screen for a few seconds after it finishes speaking,
// rather than snapping away the moment the audio ends — the text version is
// the point, and it needs to outlast the speech to be readable.
function scheduleWakePanelHide(delayMs) {
  if (!_wakePanelActive) return;
  if (_wakePanelHideTimer) clearTimeout(_wakePanelHideTimer);
  _wakePanelHideTimer = setTimeout(hideWakePanel, delayMs == null ? WAKE_PANEL_LINGER_MS : delayMs);
}

function hideWakePanel() {
  if (_wakePanelHideTimer) { clearTimeout(_wakePanelHideTimer); _wakePanelHideTimer = null; }
  if (!_wakePanelActive) return;
  _wakePanelActive = false;
  if (_voiceModalOpen) return; // the manual modal took over — leave its own presentation alone
  document.getElementById('voice-modal-title').classList.remove('wake-badge');
  const statusEl = document.getElementById('voice-modal-status');
  statusEl.classList.remove('wake-hearing', 'wake-thinking');
  document.getElementById('voice-mic-indicator').classList.remove('listening');
  document.getElementById('patient-info-voice').classList.remove('wake-auto');
  document.getElementById('patient-info-voice').style.display = 'none';
  document.getElementById('patient-info-normal').style.display = 'block';
  document.getElementById('patient-info').classList.remove('voice-active');
}

// Reported on the toggle button itself rather than kept internal: the first
// version failed silently in several ways at once (no SpeechRecognition on
// iOS Safari, a refused mic, a start() that threw) and all of them looked
// identical from the outside — a button reading "On" with nothing
// happening. The label is the only feedback surface this control has, so it
// shows the REAL state, not just the stored preference.
let _wakeStatus = 'off'; // 'off' | 'starting' | 'listening' | 'denied' | 'unavailable'
let WAKE_STATUS_LABELS = {
  off: '\u{1F3A4} Auto-listen: Off',
  starting: '\u{1F3A4} Auto-listen: Starting…',
  listening: '\u{1F3A4} Auto-listen: Listening',
  denied: '\u{1F3A4} Auto-listen: Mic blocked',
  unavailable: '\u{1F3A4} Auto-listen: Not supported'
};
function setWakeStatus(status) {
  if (_wakeStatus === status) return;
  _wakeStatus = status;
  syncWakeWordUI();
}

function syncWakeWordUI() {
  const btn = document.getElementById('wake-word-toggle-btn');
  if (!btn) return;
  btn.textContent = WAKE_STATUS_LABELS[_wakeWordEnabled ? _wakeStatus : 'off'] || WAKE_STATUS_LABELS.off;
  btn.classList.toggle('active', _wakeWordEnabled && _wakeStatus === 'listening');
  btn.classList.toggle('warn', _wakeWordEnabled && (_wakeStatus === 'denied' || _wakeStatus === 'unavailable'));
  btn.title = _wakeStatus === 'unavailable' ? 'This browser has no speech recognition — use Chrome (iOS Safari doesn’t support it).'
    : _wakeStatus === 'denied' ? 'Microphone permission was refused — allow it, then tap this again.'
    : 'Say the patient’s name (or "hello") to talk to them; "assessment…" / "treatment…" for the other two.';
}
syncWakeWordUI(); // reflect the persisted (localStorage) state before any button is pressed

function toggleWakeWord() {
  _wakeWordEnabled = !_wakeWordEnabled;
  localStorage.setItem(WAKE_WORD_LS_KEY, _wakeWordEnabled ? '1' : '0');
  if (_wakeWordEnabled) {
    if (_wakeStatus === 'denied') _wakeStatus = 'off'; // an explicit re-toggle is the retry, since startWakeListening() won't retry a latched refusal on its own
    unlockSpeechSynthesis(); // this tap is a real user gesture — take the chance to unlock TTS so wake-triggered replies can actually be spoken
    unlockPiperAudio();
    // 'starting' up front, not left on the stale 'off': startWakeListening()
    // legitimately no-ops until a session is joined, and without this the
    // button would sit there reading "Off" immediately after being switched
    // on — the exact ambiguity this status line exists to remove.
    setWakeStatus('starting');
    startWakeListening();
  } else {
    stopWakeListening();
    setWakeStatus('off');
    syncWakeWordUI();
  }
}

// Guarded so it's always safe to call speculatively (e.g. after a reply
// finishes speaking, or right after connecting) — only actually starts the
// mic when auto-listen is on and nothing else currently owns it. Also
// re-armed from tick() every second, which is what makes every failure
// path below self-healing: any missed/failed restart is retried on the next
// tick rather than leaving auto-listen silently dead for the rest of the
// session (which is exactly how the first version failed).
function startWakeListening() {
  if (_patientDisplayMode === 'monitor') return; // this device's mic is intentionally never used in Monitor Only mode — see setDisplayMode()
  if (!_wakeWordEnabled || _wakeRecognition || _voiceModalOpen || _isSpeaking || !sessionCode) return;
  const Ctor = getSpeechRecognitionCtor();
  if (!Ctor) { setWakeStatus('unavailable'); return; } // no SpeechRecognition at all — iOS Safari, this tool's primary device (same Chrome-only limitation the push-to-talk mic reports in its own status line)
  if (_wakeStatus === 'denied') return; // mic permission refused — retrying every tick would just spam the browser; the student has to re-toggle after granting it
  const rec = new Ctor();
  rec.lang = 'en-AU';
  rec.continuous = true;
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  rec.onresult = handleWakeResult;
  rec.onstart = () => { if (_wakeRecognition === rec) setWakeStatus('listening'); };
  rec.onerror = (ev) => {
    // 'no-speech'/'aborted'/'network' are all ordinary and recoverable —
    // onend fires next and the restart (or tick()'s re-arm) handles them.
    // A permission refusal is not recoverable by retrying, so it latches.
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') setWakeStatus('denied');
  };
  rec.onend = () => {
    // Only clear the shared handle if THIS instance is still the current
    // one. A late onend from an instance that stopWakeListening() already
    // abandoned would otherwise null out a newer, actually-running
    // instance — after which the next start() hits InvalidStateError with
    // two recognitions live, and auto-listen dies for good.
    if (_wakeRecognition !== rec) return;
    _wakeRecognition = null;
    if (_wakeStatus === 'listening') setWakeStatus('starting');
    // Chrome's continuous mode still stops itself periodically — restart
    // automatically unless something else (a manual exchange, the patient
    // talking, the toggle being switched off) now owns the mic/speaker.
    if (_wakeWordEnabled && !_voiceModalOpen && !_isSpeaking) setTimeout(startWakeListening, 300);
  };
  // Assigned BEFORE start() so onstart/onend (which can fire synchronously
  // in some builds) see the right current instance. On a throw — most often
  // InvalidStateError from a previous instance still shutting down — it's
  // cleared again and tick()'s re-arm retries a second later, rather than
  // the original version's silent permanent dead end (start() throwing
  // meant onend never fired, so nothing was left to trigger a retry).
  _wakeRecognition = rec;
  setWakeStatus('starting');
  try { rec.start(); } catch (e) { _wakeRecognition = null; }
}

function stopWakeListening() {
  if (_wakeRecognition) {
    const rec = _wakeRecognition;
    _wakeRecognition = null; // cleared first so rec's own onend sees itself as no longer current and doesn't schedule a restart
    try { rec.abort(); } catch (e) {}
  }
  if (_wakeStatus !== 'denied' && _wakeStatus !== 'unavailable') setWakeStatus(_wakeWordEnabled ? 'starting' : 'off');
}

function handleWakeResult(ev) {
  if (_voiceModalOpen || _lastChatSentId || _wakeSendInFlight) return; // a manual exchange or an already-in-flight wake item owns the floor
  for (let i = ev.resultIndex; i < ev.results.length; i++) {
    if (!ev.results[i].isFinal) continue;
    const transcript = ev.results[i][0].transcript || '';
    let query = null, mode = null, isGreeting = false;
    if (Date.now() < _wakeArmedUntil) {
      query = transcript.trim();
      mode = _wakeArmedMode;
      isGreeting = _wakeArmedGreeting;
    } else {
      const hit = findWakePhrase(transcript);
      if (hit) {
        // Leading punctuation is stripped too — "Dave, can you hear me?"
        // leaves ", can you hear me?" once the phrase itself is removed.
        query = transcript.slice(hit.contentFrom).replace(/^[\s,.;:!?—–-]+/, '').trim();
        mode = hit.entry.mode;
        isGreeting = !!hit.entry.greeting;
      }
    }
    _wakeArmedUntil = 0;
    _wakeArmedMode = null;
    _wakeArmedGreeting = false;
    if (query === null) continue; // no wake phrase heard in this utterance — ordinary crosstalk, ignored
    if (!query) { // phrase said alone — wait for the follow-up line
      _wakeArmedUntil = Date.now() + WAKE_FOLLOWUP_MS;
      _wakeArmedMode = mode;
      _wakeArmedGreeting = isGreeting;
      // The trigger landed but there's nothing to send yet — this is the
      // state that most needed a visible cue, since otherwise saying the
      // patient's name on its own looked exactly like not being heard.
      showWakePanel(mode, { state: 'hearing', status: 'Heard you — go ahead…', heard: '', clearReply: true });
      continue;
    }
    showWakePanel(mode, { state: 'thinking', status: WAKE_THINKING_STATUS[mode] || 'Thinking', heard: query, clearReply: true });
    sendWakeItem(query, mode, isGreeting);
    return;
  }
}

// Funnels a wake-triggered treat/assess/talk item through the exact same
// student_queue path a manual button press uses (queueStudentItem, then
// processStudentQueue on sim_control.html's side dispatches by type — see
// CLAUDE.md). 'treatment' is genuinely fire-and-forget there (giveTreatment
// writes no patient_reply, same as the manual Treat button's flow), so only
// 'chat'/'exam' get the _lastChatSentId/_lastChatSentMode pair
// checkForPatientReply matches a reply against — the reply itself still
// arrives via the normal poll and speaks through speakPatientReply.
async function sendWakeItem(text, mode, isGreeting) {
  if (!sessionCode || _lastChatSentId || _wakeSendInFlight) return;
  // One-shot: retire the bootstrap greeting triggers the instant one of them
  // actually fires, regardless of whether the send below succeeds — from the
  // student's perspective they've already "used" it either way.
  if (isGreeting) _greetingWakeWordsActive = false;
  _wakeSendInFlight = true;
  const tracksReply = mode !== 'treatment';
  if (tracksReply) {
    _lastChatSentId = -1; // synchronous placeholder — blocks a near-simultaneous second wake detection from also queueing while the real id is still in flight below
    _lastChatSentMode = mode;
    _wakeSentAtMs = Date.now(); // starts the reply-timeout clock — see clearStalePendingWakeItem()
  }
  try {
    const id = await queueStudentItem(mode, text);
    if (tracksReply) {
      _lastChatSentId = id;
    } else {
      // Treatment gets no reply to wait for, so this is the whole outcome —
      // confirm it landed, then let the panel time out on its own.
      showWakePanel(mode, { status: 'Sent to the assessor.' });
      scheduleWakePanelHide(3500);
    }
  } catch (e) {
    if (tracksReply) { _lastChatSentId = null; _wakeSentAtMs = 0; } // best-effort — a missed wake item just needs repeating
    showWakePanel(mode, { status: 'Couldn’t send — check the connection and say it again.' });
    scheduleWakePanelHide(5000);
  } finally {
    _wakeSendInFlight = false;
  }
}

// Press-and-hold handlers for the three fab buttons (Treat/Assess/Talk).
// In speech mode, pointerdown opens the panel and starts listening,
// pointerup/pointercancel stops it (an explicit stop still runs onresult's
// final pass before onend, same as a natural silence-timeout stop — see
// startVoiceCapture). In type mode there's nothing to hold: pointerdown just
// opens the panel (openVoiceModal already focuses the text field via
// beginCapture), and release is a no-op. setPointerCapture keeps the release
// tied to the same button even if the finger slides off it mid-hold.
// Tap-to-toggle for all three fab buttons (Treat/Assess/Talk) — replaced
// the old press-and-hold model (see git history) so the button itself can
// double as the panel's only open/close control, with Cancel gone. First
// tap opens the mic (button goes red with an X — see the .armed CSS rule
// and isFabArmed() below); a second tap on the SAME button closes it again.
// Realtime Voice (beta) only replaces "Talk to Patient" — Give
// Treatment/Assessment always stay on the legacy SpeechRecognition +
// sim_control.html queue flow, since those still need the assessor's
// scenario-authoring context (giveTreatment) or aren't latency-sensitive in
// the same way.
function handleFabTap(mode) {
  if (_patientDisplayMode === 'monitor') return; // buttons are hidden in this mode anyway — belt-and-braces against any programmatic call
  const armed = isFabArmed(mode);
  if (mode === 'chat' && _rtVoiceEnabled) {
    if (armed) requestEndRealtimeCall(); else startRealtimeCall();
    return;
  }
  if (armed) {
    // Second tap: if speech is actively being captured right now, stop it —
    // the same "send whatever was heard so far" behaviour hold-release used
    // to have, just tap-triggered (see startVoiceCapture()'s onend). If
    // between turns instead (already sent, waiting on a reply, or typing),
    // there's nothing to stop capturing, so just close outright — this is
    // Cancel's old job, now folded into the same button.
    if (_recognitionActive) { try { _recognition.stop(); } catch (e) {} }
    else { closeVoiceModal(); }
  } else {
    openVoiceModal(mode);
  }
}

// Whether a fab button's own session is currently "open" (red-X state).
// Deliberately NOT the same thing as "is SpeechRecognition running RIGHT
// NOW" — between turns (already sent, waiting on a reply) recognition is
// stopped but the conversation is still open, and the button should keep
// showing armed until closeVoiceModal() actually runs (manually, or via
// checkForPatientReply()'s auto-close for Treat/Assess).
function isFabArmed(mode) {
  if (mode === 'chat' && _rtVoiceEnabled) return _rtActive && !_rtMicClosed;
  return _voiceModalOpen && _voiceMode === mode;
}

function syncFabArmedUI() {
  document.getElementById('voice-fab-treatment').classList.toggle('armed', isFabArmed('treatment'));
  document.getElementById('voice-fab-exam').classList.toggle('armed', isFabArmed('exam'));
  document.getElementById('voice-fab-chat').classList.toggle('armed', isFabArmed('chat'));
}

// Single entry point for "start waiting on the next question/answer" —
// starts the mic in speech mode, or just clears/focuses the text field in
// typed mode. Called on open, via handleFabTap. The Talk to Patient
// continuous-conversation loop (legacy, non-Realtime) now calls this again
// itself once a reply finishes — see resumeIfConversing() in
// checkForPatientReply — since re-arming automatically after each reply is
// what "tap to open, tap to close" implies for an ongoing conversation, the
// same way Realtime Voice's own mic already never stops between turns.
function beginCapture() {
  document.getElementById('patient-reply-display').style.display = 'none';
  if (_inputMode === 'type') {
    document.getElementById('voice-modal-status').textContent = 'Type your message below.';
    document.getElementById('voice-modal-transcript').textContent = '';
    const inputEl = document.getElementById('type-input');
    inputEl.value = '';
    setTimeout(() => inputEl.focus(), 50);
  } else {
    startVoiceCapture();
  }
}

// Auto-starts listening as soon as it's called, and auto-sends as soon as
// recognition stops (Chrome's continuous=false auto-stops after a pause in
// speech) — no manual Send tap needed in speech mode. onend always fires
// after either a natural pause or an explicit stop/abort, so it's the
// single place that triggers the send.
function startVoiceCapture() {
  const Ctor = getSpeechRecognitionCtor();
  const statusEl = document.getElementById('voice-modal-status');
  const transcriptEl = document.getElementById('voice-modal-transcript');
  const micEl = document.getElementById('voice-mic-indicator');
  _voiceFinalText = '';
  transcriptEl.textContent = '';
  if (!Ctor) {
    statusEl.textContent = 'Speech recognition isn\u2019t available in this browser \u2014 use Chrome, or switch to Type.';
    return;
  }
  if (_recognition) { try { _recognition.abort(); } catch (e) {} }
  _recognition = new Ctor();
  _recognition.lang = 'en-AU';
  _recognition.continuous = false;
  _recognition.interimResults = true;
  _recognition.maxAlternatives = 1;
  statusEl.textContent = 'Listening\u2026';
  micEl.classList.add('listening');
  _recognitionActive = true;
  _recognition.onresult = (ev) => {
    let interim = '', final = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const t = ev.results[i][0].transcript;
      if (ev.results[i].isFinal) final += t; else interim += t;
    }
    if (final) _voiceFinalText = (_voiceFinalText + ' ' + final).trim();
    transcriptEl.textContent = (_voiceFinalText + ' ' + interim).trim();
  };
  _recognition.onerror = (ev) => {
    micEl.classList.remove('listening');
    statusEl.textContent = ev.error === 'no-speech' ? 'Didn\u2019t catch anything \u2014 tap the button and try again.' : `Speech recognition error: ${ev.error}`;
  };
  _recognition.onend = () => {
    // _recognition itself stays a truthy (but now-dead) object here \u2014 only
    // closeVoiceModal() nulls it out \u2014 so handleFabTap()'s "is a second tap
    // meant to stop live capture, or just close the panel?" check needs its
    // own flag rather than testing _recognition's mere existence. Without
    // this, tapping the (still-armed-looking) button after a natural
    // no-speech timeout called .stop() on an already-dead recognition and
    // silently did nothing instead of closing.
    _recognitionActive = false;
    micEl.classList.remove('listening');
    if (_voiceFinalText) {
      sendCapturedText(_voiceFinalText);
    } else {
      statusEl.textContent = 'Didn\u2019t catch anything \u2014 tap the button and try again.';
    }
  };
  try { _recognition.start(); } catch (e) { _recognitionActive = false; micEl.classList.remove('listening'); statusEl.textContent = 'Could not start the microphone.'; }
}

function closeVoiceModal() {
  _voiceModalOpen = false;
  if (_rtActive) endRealtimeCall(); // this is the shared close path for Realtime Voice's live call too (a second Talk tap while mid-reply routes through requestEndRealtimeCall() first, which calls this once the reply finishes) — tear down the socket/mic/audio, not just the panel
  // Also the dismiss path for an auto-listen exchange — this is the shared
  // close path, and without this it would hide the panel while leaving
  // _wakePanelActive and the wake-* classes set, so the next wake exchange
  // would inherit stale styling and a pending hide timer.
  hideWakePanel();
  document.getElementById('voice-mic-indicator').classList.remove('listening');
  if (_recognition) { try { _recognition.abort(); } catch (e) {} _recognition = null; }
  _recognitionActive = false;
  if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }
  document.getElementById('patient-info-voice').style.display = 'none';
  document.getElementById('patient-info-normal').style.display = 'block';
  document.getElementById('patient-info').classList.remove('voice-active');
  syncFabArmedUI();
  startWakeListening(); // hand the mic back to auto-listen, if it's on
}

// Shared by both input modes — speech's onend handler and Type's Send
// button/Enter key both funnel through here.
async function sendCapturedText(text) {
  text = (text || '').trim();
  if (!text || !sessionCode) return;
  const statusEl = document.getElementById('voice-modal-status');
  statusEl.textContent = 'Sending\u2026';
  try {
    const id = await queueStudentItem(_voiceMode, text);
    if (_voiceMode === 'treatment') {
      statusEl.textContent = 'Sent.';
      setTimeout(closeVoiceModal, 900);
    } else {
      _lastChatSentId = id;
      _lastChatSentMode = _voiceMode;
      statusEl.textContent = _voiceMode === 'exam' ? 'Waiting for the finding\u2026' : 'Waiting for the patient to reply\u2026';
    }
  } catch (e) {
    statusEl.textContent = 'Could not send \u2014 check the connection and try again.';
  }
}

async function sendTypedText() {
  const inputEl = document.getElementById('type-input');
  const text = inputEl.value;
  inputEl.value = '';
  await sendCapturedText(text);
}

// Called from pollSession() every ~3s — matches the reply against the last
// chat/exam question THIS device sent (forId), and against the last reply
// already shown (reply.id) so it doesn't re-speak on every poll.
function checkForPatientReply(reply) {
  if (!reply || !_lastChatSentId) return;
  if (reply.forId !== _lastChatSentId) return;
  if (reply.id === _lastShownReplyId) return;
  _lastShownReplyId = reply.id;
  const mode = _lastChatSentMode;
  const isExam = mode === 'exam';
  const isConversation = mode === 'chat'; // only "Talk to Patient" auto-relistens once the reply finishes
  const replyEl = document.getElementById('patient-reply-display');
  replyEl.textContent = isExam ? reply.text : `\u201C${reply.text}\u201D`;
  replyEl.style.display = 'block';
  const statusEl = document.getElementById('voice-modal-status');
  statusEl.textContent = VOICE_MODE_REPLY_LABELS[mode] || 'Reply:';
  statusEl.classList.remove('wake-hearing', 'wake-thinking'); // the answer is in — stop the in-flight animation
  _lastChatSentId = null;
  _wakeSentAtMs = 0; // the reply arrived, so the wake-item timeout has nothing left to release

  // Once the reply is done: Assess auto-closes (there's nothing more to do
  // with a finding once you've read/heard it — see CLAUDE.md's note on the
  // fab buttons auto-closing "once there's been a response"), Talk re-arms
  // its mic automatically for the next line (tap-to-toggle means there's no
  // hold gesture to prompt for anymore — the mic just stays open across
  // turns, same as Realtime Voice's own continuous listening already
  // does), and Treat isn't handled here at all (it never sets
  // _lastChatSentId — see sendCapturedText — so never reaches this
  // function; its own auto-close already runs right after sending).
  // Guarded by _voiceModalOpen throughout so a reply that arrives after the
  // student has already closed the modal does nothing.
  const resumeIfConversing = () => {
    // Wake-word exchange: no modal to resume into, so the job here is just
    // to leave the reply text up long enough to read before the panel
    // retires itself and the normal Patient/Scene Info comes back.
    if (_wakePanelActive && !_voiceModalOpen) { scheduleWakePanelHide(); return; }
    if (!_voiceModalOpen) return;
    if (isExam) { setTimeout(closeVoiceModal, 900); return; } // same brief "let it stay readable" grace period Treat's own send confirmation uses
    if (isConversation) beginCapture();
  };

  if (reply.speak !== false) {
    // Exam findings ("Assess") always read in the plain standard voice, even
    // with HQ Voice on — it's assessment feedback, not the patient speaking
    // in character, and should sound distinct from the patient's own
    // dialogue rather than sharing the same (possibly HQ) voice.
    speakPatientReply(reply.text, resumeIfConversing, isConversation, hqVoiceEnabled && !isExam);
  } else {
    // No speech at all (e.g. GCS-gated "no verbal response") — pause briefly
    // so the text is readable, then resume listening for the next question.
    // Called unconditionally now rather than only for chat: resumeIfConversing
    // guards its own cases, and a silent reply during a wake exchange still
    // needs the panel retired (nothing else would ever hide it).
    setTimeout(resumeIfConversing, 1500);
  }
}
</script>
<script src="nav.js"></script>
</body>
</html>
