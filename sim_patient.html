<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Live Scenario — Patient View</title>
<script>
// Apply saved theme immediately to prevent flash
(function(){const t=localStorage.getItem('av_theme');if(t&&t!=='default')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
:root {
  --navy: #2C4F7C; --navy-dark: #1E3555; --navy-light: #4E7FAE;
  --red: #C0392B; --red-light: #FDEDEC;
  --amber: #E8921A; --amber-light: #FEF5E7;
  --green: #27833A; --green-light: #EAFAF1;
  --blue: #2E86C1; --blue-light: #EBF5FB;
  --purple: #7D3C98; --purple-light: #F5EEF8;
  --grey: #6C7A89; --light: #F4F6F9; --white: #FFFFFF; --text: #1A1A2E; --border: #D5D8DC;
  --shadow: 0 2px 8px rgba(28,58,110,0.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; height: 100dvh; overflow: hidden; background: linear-gradient(135deg, #2C4F7C 0%, #4E7FAE 55%, #6FA0CC 100%); color: #1e2a36; font-family: 'Courier New', monospace; }
body { display: flex; flex-direction: column; }
#topbar { flex-shrink: 0; background: var(--navy); box-shadow: 0 2px 8px rgba(0,0,0,0.25); padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
/* sim_combo.html hides this page's own topbar and surfaces the same
   controls (pause/instant-mode status, display mode, voice toggles,
   timer) in its own single shared topbar instead — see that file and
   the matching rule in sim_control.html. #main is already flex:1 in a
   flex-column body, so hiding #topbar just lets it fill the freed
   space. */
body.embed #topbar { display: none; }
#topbar .title { font-size: 12px; font-weight: 900; letter-spacing: 1px; color: #ffffff; text-transform: uppercase; }
#topbar-right { display: flex; align-items: center; gap: 14px; }
#instant-mode-label { font-size: 10px; display: flex; align-items: center; gap: 4px; color: rgba(255,255,255,0.85); cursor: pointer; user-select: none; }
#hq-voice-label { font-size: 10px; display: flex; align-items: center; gap: 4px; color: rgba(255,255,255,0.85); cursor: pointer; user-select: none; }
#hq-voice-status { font-size: 9px; font-style: italic; color: rgba(255,255,255,0.6); max-width: 110px; }
#hq-voice-status.hq-voice-status-ready { color: #4ade80; font-style: normal; }
#hq-voice-status.hq-voice-status-error { color: #f87171; font-style: normal; cursor: pointer; text-decoration: underline dotted; }
#scenario-timer { font-size: 13px; font-weight: 700; color: #4ade80; }
#patient-info { flex-shrink: 0; }
#main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 10px; overflow: hidden; }
@media (min-width: 800px) { #main { flex-direction: row; } }
.panel { background: #ffffff; border: 1px solid #d7dee6; border-radius: 8px; padding: 10px; }
#monitor-col { background: #0a0e16 !important; border-color: #142235 !important; min-height: 0; position: relative; }
/* No max-width by default — #main is a column (stacked) below 800px, so
   #info-col already gets the full available width there with nothing to cap
   it against; this matters most in Avatar Only mode (see below), the whole
   point of which is letting the avatar use the full phone screen instead of
   being squeezed to a fraction of it. The 280px sidebar cap only makes sense
   once #main switches to a row layout (see the @media block) and #info-col
   is genuinely sitting next to a wide monitor column, not stacked above/
   below it. */
#info-col { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 0; }
/* Scoped to Standard specifically (not just the width breakpoint) — Avatar
   Only never has a #monitor-col to share the row with (it's hidden), so
   there's nothing for this cap to protect there even if someone forces
   Avatar Only on a wide screen. */
@media (min-width: 800px) { body.mode-standard #info-col { max-width: 280px; } }
/* Display mode (Standard / Monitor Only / Avatar Only) — see setDisplayMode()
   for why this exists: splitting the "patient" role across two physical
   devices when one of them can't do voice reliably. Monitor Only also hides
   every voice control, not just the avatar column, since the whole point is
   this device's mic never gets touched — see the JS-side guards for the
   non-visual half of that (a hidden button alone doesn't stop e.g. auto-listen
   resuming from a stale localStorage flag). */
body.mode-monitor #info-col,
body.mode-monitor #hq-voice-label,
body.mode-monitor #hq-voice-status,
body.mode-monitor #rt-voice-label,
body.mode-monitor #rt-voice-status { display: none !important; }
body.mode-avatar #monitor-col { display: none !important; }
#display-mode-select { font-size: 10px; background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.3); border-radius: 6px; padding: 3px 6px; cursor: pointer; }
#patient-info h2 { font-size: 12px; color: #0369a1; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
#patient-info .row { font-size: 12px; color: #33475a; margin-bottom: 3px; }
#patient-graphic { flex: 1; min-height: 100px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
#patient-graphic img { max-width: 100%; max-height: 100%; object-fit: contain; }

/* Monitor main row (ECG + narrow vitals sidebar side-by-side, matching monitor.html) */
#monitor-main { display: flex; flex-direction: row; flex: 1; min-height: 0; overflow: hidden; border-bottom: 2px solid #0d1f35; }
#ecg-section { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #060606; overflow: hidden; border-right: 2px solid #0d1f35; }
.ecg-section-bar { display: flex; align-items: center; justify-content: space-between; padding: 6px 12px; background: #060910; border-bottom: 1px solid #0d1f35; font-size: 10px; letter-spacing: 1.5px; color: #00ff88; text-transform: uppercase; flex-shrink: 0; }
.ecg-snapshot-btn { background: rgba(0,255,136,0.08); border: 2px solid #00ff88; color: #00ff88; font-family: 'Courier New', monospace; font-size: 11px; font-weight: bold; letter-spacing: 1px; padding: 4px 12px; cursor: pointer; text-transform: uppercase; border-radius: 4px; }
.ecg-snapshot-btn:disabled { opacity: 0.5; cursor: default; }
#ecg-display-wrap { position: relative; flex: 1; min-height: 0; overflow: hidden; }
#ecg-12lead-container { width: 100%; height: 100%; overflow: hidden; cursor: pointer; }
#ecg-apply-overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(6,9,16,0.94); text-align: center; padding: 10px; z-index: 5; }
.ecg-overlay-text { color: #00ff88; font-size: 12px; letter-spacing: 1px; }
.apply-btn-lg { background: rgba(0,255,136,0.1); border: 2px solid #00ff88; color: #00ff88; font-family: 'Courier New', monospace; font-size: 12px; font-weight: bold; padding: 10px 18px; border-radius: 6px; cursor: pointer; letter-spacing: 1px; }
#ecg-progress-banner { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.75); color: #00ff88; font-size: 10px; text-align: center; padding: 3px 6px; letter-spacing: 1px; display: none; z-index: 6; pointer-events: none; }

/* Vitals sidebar — narrow column beside the ECG, each block flex:1 (matches monitor.html #vitals-panel) */
#monitor-box { width: 150px; flex-shrink: 0; display: flex; flex-direction: column; background: #080c14; overflow: hidden; }
.vblock { flex: 1; min-height: 0; display: flex; flex-direction: column; border-bottom: 2px solid #0d1f35; padding: 3px 8px; overflow: hidden; cursor: pointer; -webkit-tap-highlight-color: rgba(255,255,255,0.15); }
.vblock:active { background: rgba(255,255,255,0.06); }
.vlabel { font-size: 8px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; flex-shrink: 0; }
.vvalue { flex: 1; display: flex; align-items: center; font-size: clamp(16px, 2.8vw, 28px); font-weight: 900; line-height: 1; font-family: 'Courier New', monospace; min-height: 0; overflow: hidden; }
.vunit { font-size: 8px; font-weight: 400; opacity: 0.7; margin-left: 3px; align-self: flex-end; }
.v-hr   .vlabel { color: #ffffff; } .v-hr   .vvalue { color: #ffffff; }
.v-bp   .vlabel { color: #7fff00; } .v-bp   .vvalue { color: #7fff00; }
.v-spo2 .vlabel { color: #4fc3f7; } .v-spo2 .vvalue { color: #4fc3f7; }
.v-etco2 .vlabel { color: #ff8a65; } .v-etco2 .vvalue { color: #ff8a65; }
#bp-timer { font-size: 7px; color: #4a6a8a; }
.apply-btn { font-size: 8px; background: none; border: 1px solid currentColor; border-radius: 3px; padding: 2px 5px; cursor: pointer; color: inherit; font-family: inherit; }
.tap-hint { font-size: 10px; opacity: 0.8; font-style: italic; }
.pending-txt { font-size: 10px; opacity: 0.85; }
.queued-txt { font-size: 9px; opacity: 0.7; font-style: italic; }

#monitor-actions-bar { flex-shrink: 0; padding: 6px 10px; border-top: 2px solid #0d1f35; text-align: center; }
.apply-all-btn { width: 100%; background: rgba(0,255,136,0.08); border: 2px solid #00ff88; color: #00ff88; font-family: 'Courier New', monospace; font-size: 11px; font-weight: bold; letter-spacing: 1px; padding: 6px 10px; cursor: pointer; text-transform: uppercase; border-radius: 4px; }
.apply-all-status { font-size: 9px; letter-spacing: 1px; color: #4a6a8a; font-style: italic; text-transform: uppercase; }

#oneoff-strip { display: flex; flex-wrap: wrap; gap: 0; border-top: 2px solid #0d1f35; }
.oo-card { flex: 1; min-width: 90px; padding: 6px 8px; border-right: 1px solid #1a2a3a; border-bottom: 1px solid #1a2a3a; cursor: pointer; -webkit-tap-highlight-color: rgba(255,255,255,0.15); }
.oo-card:active { background: rgba(255,255,255,0.06); }
.oo-label { font-size: 8px; font-weight: 700; color: #4a6a8a; text-transform: uppercase; letter-spacing: 1px; }
.oo-value { font-size: 15px; font-weight: 700; color: #c0d4e8; }
.oo-tap-again { font-size: 8px; color: #4fc3f7; margin-top: 2px; font-style: italic; }
.oo-pending { font-size: 10px; color: #4fc3f7; margin-top: 2px; }
.oo-queued { font-size: 9px; color: #6b8299; margin-top: 2px; font-style: italic; }

/* Defib strip — bottom row of the monitor. Four blank placeholder keys for
   now, then Charge/Shock. The joule tower is an overlay (not part of flex
   flow) anchored above this strip, matching a real monitor's energy-select
   column covering part of the trace while armed. */
#defib-strip { display: flex; flex-shrink: 0; height: 40px; border-top: 2px solid #0d1f35; background: #080c14; }
.defib-btn { flex: 1; border: none; border-right: 1px solid #1a2a3a; background: transparent; font-family: 'Courier New', monospace; font-weight: 700; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #3a5570; -webkit-tap-highlight-color: rgba(255,255,255,0.15); }
.defib-btn:last-child { border-right: none; }
.defib-btn:disabled { cursor: default; }
#defib-charge-btn { color: #fbbf24; cursor: pointer; }
#defib-charge-btn:active:not(:disabled) { background: rgba(251,191,36,0.15); }
#defib-shock-btn { color: #ff5a36; cursor: pointer; }
#defib-shock-btn:disabled { color: #5a2a1c; cursor: default; }
#defib-shock-btn:active:not(:disabled) { background: rgba(255,90,54,0.2); }
#defib-discharge-btn:not(:disabled) { color: #94a3b8; cursor: pointer; }
#defib-discharge-btn:active:not(:disabled) { background: rgba(148,163,184,0.15); }

#joule-tower { position: absolute; right: 0; top: 0; bottom: 40px; width: 15%; display: none; flex-direction: column; overflow-y: auto; background: #060910; border-left: 2px solid #1a2a3a; border-top: 2px solid #1a2a3a; z-index: 20; }
.joule-row { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; font-family: 'Courier New', monospace; font-size: 13px; font-weight: 700; color: #c0d4e8; border-bottom: 1px solid #101c2c; cursor: pointer; -webkit-tap-highlight-color: rgba(255,255,255,0.15); }
.joule-row.joule-charged { background: #274a66; color: #eaf6ff; }
.joule-row.joule-selected { background: #0369a1; color: #fff; }

/* Voice capture — Give Treatment / Talk to Patient ------------------------ */
#voice-fab-strip { display: flex; flex-direction: row; gap: 6px; flex-shrink: 0; width: 100%; max-width: 240px; }
.voice-fab { flex: 1; min-height: 26px; display: flex; align-items: center; justify-content: center; gap: 4px; border-radius: 7px; border: none; background: #0369a1; color: #fff; font-family: 'Courier New', monospace; font-weight: 700; font-size: 10px; letter-spacing: 0.3px; cursor: pointer; padding: 4px 6px; -webkit-tap-highlight-color: rgba(255,255,255,0.2); user-select: none; }
.voice-fab svg { width: 11px; height: 11px; flex-shrink: 0; fill: currentColor; }
.voice-fab:active { background: #075985; }
#voice-fab-chat { background: #15803d; }
#voice-fab-chat:active { background: #14532d; }
#voice-fab-exam { background: #7c3aed; }
#voice-fab-exam:active { background: #5b21b6; }
/* Tap-to-toggle armed state (mic open) — see handleFabTap()/isFabArmed().
   Turns red regardless of the button's own idle colour (green/purple/blue),
   which needs the ID+class overrides below since a bare ID selector like
   #voice-fab-chat otherwise outranks a two-class one on specificity alone. */
.voice-fab .fab-idle, .voice-fab .fab-armed { display: inline-flex; align-items: center; gap: 4px; }
.voice-fab .fab-armed { display: none; }
.voice-fab.armed .fab-idle { display: none; }
.voice-fab.armed .fab-armed { display: inline-flex; }
.voice-fab.armed,
#voice-fab-chat.armed,
#voice-fab-exam.armed { background: #dc2626; }
.voice-fab.armed:active,
#voice-fab-chat.armed:active,
#voice-fab-exam.armed:active { background: #b91c1c; }
#wake-word-toggle-btn { width: 100%; max-width: 240px; min-height: 22px; margin-top: 4px; border-radius: 7px; border: 1px solid #d7dee6; background: #f7fafc; color: #33475a; font-family: 'Courier New', monospace; font-weight: 700; font-size: 9px; letter-spacing: 0.3px; cursor: pointer; padding: 3px 6px; -webkit-tap-highlight-color: rgba(255,255,255,0.2); }
#wake-word-toggle-btn.active { background: #15803d; color: #fff; border-color: #15803d; }
#wake-word-toggle-btn.warn { background: #b91c1c; color: #fff; border-color: #b91c1c; }

/* Floating head + mic badge — mic sits just above/right of the gif, flat
   red icon, invisible unless actively listening (toggled via .listening,
   same mechanism as before — just relocated and restyled). */
/* height:100% (not the old inline-block/content-sized box) is what makes the
   avatar actually grow to fill #avatar-row's real height instead of sitting
   at its own small intrinsic SVG size with empty panel around it — see
   #avatar-row below for why that height is now real or #av-svg's own rule
   for why growing it doesn't distort/crop it. min-width/min-height:50px is
   the OTHER direction's floor (shrinking, not growing) — see the Gotchas
   section in CLAUDE.md for why that one still needs to stay. */
#head-wrap { position: relative; line-height: 0; min-width: 50px; min-height: 50px; height: 100%; overflow: hidden; }
#av-svg { height: 100%; width: auto; max-width: 100%; display: block; }
/* Skin tint eases rather than snapping so the once-a-second tick lines up
   visually with the continuously-drifting vitals underneath it (see
   applySkinTint()) instead of reading as a hard colour cut every tick. */
#av-head-path, #av-head-bulge, #av-eye-l-lid, #av-eye-r-lid { transition: fill 1.1s ease; }
#av-sweat path { transition: opacity 1.1s ease, transform 1.1s ease; transform-box: fill-box; transform-origin: center; }
#av-lip-cyanosis ellipse { transition: opacity 1.1s ease; }
#voice-mic-indicator { display: none; position: absolute; top: -8px; right: -8px; width: 22px; height: 22px; align-items: center; justify-content: center; background: #fff; border-radius: 50%; box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
#voice-mic-indicator svg { width: 13px; height: 13px; fill: #dc2626; }
#voice-mic-indicator.listening { display: flex; animation: micBlink 1s steps(1) infinite; }
/* "Connecting…" state — see showRealtimeConnectingIndicator(). Same badge
   position as the red mic icon above (reusing it rather than adding a new
   floating element elsewhere), swapped for a spinning ring instead: the mic
   icon means "you're being heard right now", which isn't true yet during
   Realtime Voice's connect gap, so it shouldn't show until socket.onopen
   actually confirms that (see revealRealtimeModal()). The two icons are
   mutually exclusive (JS only ever sets one class at a time), so no
   specificity fight between these rules and .listening above. */
#voice-mic-indicator.connecting { display: flex; }
#voice-mic-indicator.connecting svg.mic-icon { display: none; }
#voice-mic-indicator .spinner-icon { display: none; }
#voice-mic-indicator.connecting .spinner-icon { display: block; fill: none; stroke: #0369a1; stroke-width: 2.5; stroke-linecap: round; animation: micSpin 0.8s linear infinite; }
@keyframes micSpin { to { transform: rotate(360deg); } }
@keyframes micBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

/* No min-height:0 here, deliberately — unlike #head-wrap (which needs that
   override to counteract ITS OWN intrinsic SVG size fighting max-height),
   this row has no such conflict, so its natural auto min-height is exactly
   what should win: "at least as tall as #head-wrap needs." Setting it to 0
   removed that floor and let #patient-graphic's flex-shrink squeeze this
   row down to a sliver, leaving #head-wrap's real (still floor-protected)
   height to spill out over the buttons below instead of being respected by
   its own parent's box. */
/* flex:1/min-height:0/align-items:stretch (not the old content-sized,
   vertically-centered row) is what gives #head-wrap real height to grow
   into — without this, #head-wrap's own height:100% above has nothing to
   resolve against, so it stays pinned to the SVG's small intrinsic size
   with unused white space filling the rest of #patient-graphic (the "too
   small" complaint). */
#avatar-row { display: flex; flex-direction: row; align-items: stretch; justify-content: center; flex: 1; min-height: 0; width: 100%; }
/* Trend arrows — see updateTrendIndicator(). Deliberately `position:fixed`
   rather than a flex sibling sitting next to the avatar: they only exist
   some of the time (count===0 hides them entirely), and living in normal
   flow next to #head-wrap meant every appear/disappear nudged the avatar's
   own width in #avatar-row's centered row — a visible "wobble" each time a
   trend crossed a threshold. Floating them out of flow entirely on the
   right edge of the viewport means the avatar's box never depends on
   whether they're showing. Applies to every display mode that shows the
   avatar (Standard and Avatar Only alike) — not gated behind a mode class
   or a mobile media query, since the wobble it fixes happens everywhere,
   not just on phones. A plain flex column (top-to-bottom in DOM order);
   which end pulses first is controlled entirely by animation-delay (see
   trendArrowMarkup()), not by reversing the DOM order, so the same markup
   works for both directions. `pointer-events:none` since it's purely
   informational and shouldn't steal taps from whatever's underneath it. */
#trend-indicator { display: none; position: fixed; top: 50%; right: 14px; transform: translateY(-50%); flex-direction: column; gap: 6px; z-index: 40; pointer-events: none; }
#trend-indicator svg { width: 34px; height: 34px; display: block; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.4)); }
#trend-indicator.up svg { fill: #16a34a; }
#trend-indicator.down svg { fill: #dc2626; }
#trend-indicator .trend-arrow { animation: trendPulse 1.3s ease-in-out infinite; }
@keyframes trendPulse { 0%, 100% { opacity: 0.35; transform: scale(0.85); } 40% { opacity: 1; transform: scale(1.08); } }
/* Bigger again on a phone-sized viewport — "significantly bigger" was
   specifically called out for mobile, where the arrows are the only
   at-a-glance trend cue once the graph (sim_control.html-only) isn't on
   screen. */
@media (max-width: 600px) {
  #trend-indicator { right: 8px; gap: 8px; }
  #trend-indicator svg { width: 48px; height: 48px; }
}

/* Voice UI takes over the "Patient / Scene Info" panel while active (a
   speech-bubble sits right above the patient graphic anyway), instead of a
   dark modal overlay — the rest of the page (monitor, vitals, one-offs)
   stays fully visible and interactive throughout, so a BP or GCS can still
   be taken mid-conversation. #patient-info-voice is display:none by
   default; openVoiceModal()/closeVoiceModal() toggle which of the two
   sits visible inside the #patient-info panel. */
/* One child now (no more #voice-modal-actions/Cancel sitting beside it as a
   second flex column) — the mic-toggle fab buttons themselves are what
   opens/closes this panel now, see handleFabTap(). */
#patient-info-voice { display: none; }
#voice-modal-title-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 4px; }
#voice-modal-title { font-size: 11px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; color: #0369a1; }
/* Small icon-only toggle, replacing the old full-width "Switch to Text"
   button that used to sit permanently under the fab strip — a hidden
   fallback (see CLAUDE.md) rather than a persistent control, since typing
   is the exception now, not a pre-set mode most students reach for. */
#input-mode-toggle-btn { flex-shrink: 0; width: 22px; height: 22px; border-radius: 5px; border: 1px solid #d7dee6; background: #f7fafc; color: #33475a; font-size: 12px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; -webkit-tap-highlight-color: rgba(255,255,255,0.2); }
#input-mode-toggle-btn.active { background: #0369a1; color: #fff; border-color: #0369a1; }
#voice-modal-status { font-size: 11px; color: #33475a; margin-bottom: 4px; min-height: 14px; }
/* Auto-listen (wake-word) exchanges reuse this same panel, but the student
   never pressed anything to open it — so it needs to announce itself more
   loudly than a modal they deliberately opened. A tinted left edge marks the
   whole panel as auto-triggered, and the two transient states get their own
   animated cue: pulsing while capturing what was said, and a travelling
   ellipsis while the assessor side is generating the reply. */
#patient-info-voice.wake-auto { border-left: 3px solid #15803d; padding-left: 8px; }
#voice-modal-title.wake-badge::after { content: ' \00b7 AUTO'; color: #15803d; }
#voice-modal-status.wake-hearing { color: #15803d; font-weight: 700; animation: wakePulse 1.1s ease-in-out infinite; }
@keyframes wakePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
#voice-modal-status.wake-thinking { color: #0369a1; font-weight: 700; }
#voice-modal-status.wake-thinking::after { content: '\2026'; display: inline-block; animation: wakeDots 1.2s steps(4) infinite; overflow: hidden; vertical-align: bottom; }
@keyframes wakeDots { 0% { width: 0; } 100% { width: 12px; } }
#voice-modal-transcript { min-height: 20px; border: 1px solid #d7dee6; border-radius: 6px; padding: 6px 8px; font-size: 13px; color: #1e2a36; margin-bottom: 4px; background: #f7fafc; }
#type-input-row { display: none; gap: 6px; margin-bottom: 4px; }
#type-input-row input { flex: 1; min-width: 0; font-size: 13px; padding: 6px 8px; border: 1px solid #d7dee6; border-radius: 6px; font-family: 'Courier New', monospace; }
#type-input-row .voice-btn { width: auto; padding: 0 12px; min-height: 34px; }
/* Bigger now that Cancel's column and the always-visible type-input row are
   gone — this is the main thing left in the panel worth giving room to. */
#patient-reply-display { font-size: 17px; line-height: 1.4; color: #15803d; margin-bottom: 0; font-style: italic; display: none; }
.voice-btn { min-height: 40px; border-radius: 6px; border: none; font-family: 'Courier New', monospace; font-weight: 700; font-size: 12px; cursor: pointer; }
.voice-btn-primary { background: #0369a1; color: #fff; }
.voice-btn-primary:disabled { opacity: 0.4; }
.topbar-logo-img { height: 26px; width: auto; max-width: 150px; object-fit: contain; flex-shrink: 0; display: block; }
#topbar #avnav-hamburger { width: 34px; height: 34px; font-size: 15px; }

/* Avatar Only on a phone-sized screen — scoped to mode-avatar specifically
   (not Standard/Monitor), since Avatar Only is the mode built for handing a
   student's own phone the patient role (see the #info-col comment up top),
   and with #monitor-col hidden this panel + the voice UI/talk buttons ARE
   the entire screen. Sizes elsewhere in this file are tuned for that panel
   sitting next to a wide monitor on a tablet, which reads as too small once
   it's the only thing on a much narrower phone screen. The talk buttons
   keep their existing row layout (Treat/Assess/Talk side by side) — only
   scaled up, not restructured. */
@media (max-width: 600px) {
  /* Demographics/dispatch/complaint/scene-time is screen real estate the
     avatar needs more than this info does on a phone — it's still one tap
     away in sim_control.html for the assessor, and nothing here reads it
     back to the student. Hidden outright (not just shrunk) rather than
     sized down like everything else in this block, and `!important` since
     openVoiceModal()/hideWakePanel()/closeVoiceModal() all set its inline
     `style.display` directly (see those functions) and would otherwise win
     over a plain override here. The OUTER #patient-info panel still needs
     to appear, though — #patient-info-voice (the Talk/Assess/Treat
     modal) lives in the same panel and takes over on voice interactions;
     `.voice-active` is the class those same functions toggle on #patient-info
     for exactly this — collapse the panel to nothing while neither child
     has anything to show, appear again the instant one does. */
  body.mode-avatar #patient-info-normal { display: none !important; }
  body.mode-avatar #patient-info:not(.voice-active) { display: none; }
  /* The voice modal (Talk/Assess/Treat status/transcript/reply) still lives
     in this same panel — see the comment above #patient-info-voice — and
     while it's showing (.voice-active), #patient-info sat in normal flow
     above #main, so every time it popped up or closed it changed #main's
     own height and, with it, the avatar's: the exact "avatar size changes"
     this is fixing. `position:fixed` takes it out of flow entirely so it
     floats as an overlay card instead — same idea as the trend arrows
     floating on the right edge (see #trend-indicator above), just anchored
     near the top here since that's this panel's own natural reading
     position (title/status first). `top:50px` clears the topbar at this
     breakpoint rather than being measured live — if the topbar's own
     height changes, revisit this. `!important` on margin overrides the
     inline `style="margin:10px 10px 0;"` set in the HTML, which a plain
     declaration here can't outrank. */
  body.mode-avatar #patient-info.voice-active {
    position: fixed;
    top: 50px;
    left: 10px;
    right: 10px;
    margin: 0 !important;
    z-index: 30;
    max-height: calc(100dvh - 64px);
    overflow-y: auto;
    box-shadow: 0 8px 22px rgba(0,0,0,0.4);
  }

  body.mode-avatar #voice-modal-title { font-size: 15px; }
  body.mode-avatar #voice-modal-status { font-size: 15px; min-height: 18px; }
  body.mode-avatar #voice-modal-transcript { font-size: 17px; padding: 10px 12px; min-height: 26px; }
  body.mode-avatar #patient-reply-display { font-size: 21px; }
  body.mode-avatar #input-mode-toggle-btn { width: 36px; height: 36px; font-size: 17px; }
  /* 16px floor on the typed-input fallback specifically stops iOS Safari's
     auto-zoom-on-focus (it zooms any input under 16px), on top of just
     being easier to read/type into. */
  body.mode-avatar #type-input-row input { font-size: 16px; padding: 10px 12px; }
  body.mode-avatar .voice-btn { min-height: 50px; font-size: 16px; }

  /* Talk/Assess/Treat strip — same 3-across row, just bigger: the request
     was specifically "keep their same layout but increase their size to
     fit the screen", so width grows to the full panel (no more 240px cap)
     and every dimension inside scales with it. */
  body.mode-avatar #voice-fab-strip { max-width: 100%; gap: 10px; }
  body.mode-avatar .voice-fab { min-height: 58px; font-size: 16px; gap: 8px; border-radius: 10px; padding: 8px 10px; }
  body.mode-avatar .voice-fab svg { width: 22px; height: 22px; }
  body.mode-avatar #wake-word-toggle-btn { max-width: 100%; min-height: 46px; font-size: 14px; margin-top: 8px; }
}
</style>

<script>
// --- Supabase session sync ------------------------------------------------
const SUPABASE_URL = 'https://befsjenbaruxqrntuhpn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJlZnNqZW5iYXJ1eHFybnR1aHBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI2MjA5MjAsImV4cCI6MjA4ODE5NjkyMH0.hOFFbIvd1wAgu-QyghupQ-7ttSpg7sxz_UsJbXyXztA';
// Realtime client, alongside (not instead of) the REST poll below — see
// sim_control.html's identical setup for why the poll stays as a fallback.
const sbRealtime = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
window.__avSupabaseClient = sbRealtime; // shared with nav.js — avoids duplicate GoTrueClient instances
let _rtChannel = null;
function subscribeSessionRealtime(code) {
  if (_rtChannel) { sbRealtime.removeChannel(_rtChannel); _rtChannel = null; }
  _rtChannel = sbRealtime.channel(`sim_session_patient_${code}`)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'sim_sessions', filter: `session_code=eq.${code}` },
      payload => { if (payload.new) applySessionRow(payload.new); })
    .subscribe();
}

async function sbGet(path) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function sbPatch(path, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    method: 'PATCH',
    headers: {
      'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json', 'Prefer': 'return=minimal'
    },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
}

// --- Sim tuning config (see sim_config_admin.html / sim_config_schema.js) --
// Fetched ONCE per page load, awaited inside the DOMContentLoaded handler
// below BEFORE the first tick() runs — not re-polled, unlike session state.
// An admin's edit needs a page reload to take effect. Every field falls back
// to this file's own hardcoded literal (now a `let`, not removed) if the
// fetch fails, the row doesn't exist yet, or sim_config_schema.js itself
// failed to load — this must never block the patient view from starting.
// Applies the SAME SimEngine.applyConfigOverrides() call sim_control.html's
// loadSimConfig() does — both pages must compute identical vitals/defib
// odds/mood from the same inputs, so this glue logic is intentionally kept
// in sync between the two files by hand (see that function's own comments).
let _simConfigLoaded = false;
async function loadSimConfig() {
  if (_simConfigLoaded) return;
  _simConfigLoaded = true;
  try {
    const rows = await sbGet('sim_config?select=section_key,value');
    const bySection = {};
    (rows || []).forEach(r => { bySection[r.section_key] = r.value || {}; });
    const schemaSections = (window.SimConfigSchema && window.SimConfigSchema.sections) || {};

// --- Improving/declining trend arrows (next to the avatar) -----------------
// Built on SimEngine.getDisplayHealthTrendLevel() — the SAME smoothed
// number sim_control.html's Health graph line plots (see that function and
// getHealthTrendLevel()/healthLevelContinuous() in sim_engine.js for the
// full chain: rhythm-aware, worst-of-trailing-window on the continuous
// abnormality basis, then a display-only moving-average pass on top to
// iron out small ripples — e.g. pain's contribution briefly spiking as its
// severity crosses a band while its consciousness-based weight is
// simultaneously fading). Using the smoothed number here too means the
// arrows react to the same picture the graph shows, not a jagged
// unsmoothed one the assessor never sees.
//
// Rhythm awareness matters here specifically: VF/pulseless VT/asystole/PEA
// all mean zero perfusion regardless of what the monitor numbers still
// read, and a naive numbers-only trend could otherwise read as "improving"
// for several minutes straight through a lethal rhythm, before the numbers
// themselves caught up — this happened in practice, verified against a
// real recorded session.
//
// A real-time reading, not a projection — this page can only ever know the
// past. delta = level now minus level TREND_WINDOW_MS ago; sign gives
// direction, magnitude gives arrow count.
const TREND_WINDOW_MS = 180000; // 3 minutes
// Points changed (0-100 scale) over TREND_WINDOW_MS needed for 1/2/3 arrows
// — tuned by eye, not from a clinical reference; adjust if arrows appear
// too eagerly or too reluctantly in practice.
const TREND_THRESHOLDS = [2, 10, 20];

function computeHealthTrend(cfg, nowMs) {
  const lookbackMs = Math.max(cfg.startTimeMs, nowMs - TREND_WINDOW_MS);
  // Less than half the window's worth of history to look back on — too
  // little to call a trend yet, rather than comparing against an
  // arbitrarily short baseline right at scenario start.
  if (nowMs - lookbackMs < TREND_WINDOW_MS * 0.5) return 0;
  return SimEngine.getDisplayHealthTrendLevel(cfg, nowMs) - SimEngine.getDisplayHealthTrendLevel(cfg, lookbackMs);
}

function trendArrowCount(delta) {
  const mag = Math.abs(delta);
  for (let i = TREND_THRESHOLDS.length - 1; i >= 0; i--) {
    if (mag >= TREND_THRESHOLDS[i]) return i + 1;
  }
  return 0;
}

// Arrows always stack top-to-bottom in DOM order; only animation-delay
// differs by direction, not the markup itself. Improving (up) pulses
// bottom-to-top — the arrow nearest the avatar fires first and the pulse
// "climbs" the stack. Declining (down) pulses top-to-bottom — fires first
// at the top and "falls" down the stack.
const TREND_STAGGER_MS = 180;
function trendArrowMarkup(count, isUp) {
  const points = isUp ? '12,5 20,17 4,17' : '12,19 20,7 4,7';
  let out = '';
  for (let i = 0; i < count; i++) {
    const delayIndex = isUp ? (count - 1 - i) : i;
    out += `<svg class="trend-arrow" style="animation-delay:${delayIndex * TREND_STAGGER_MS}ms;" viewBox="0 0 24 24"><polygon points="${points}"/></svg>`;
  }
  return out;
}

// Only rebuilds the DOM when the arrow count/direction actually changes —
// rewriting innerHTML every tick (~1/sec) would restart each arrow's CSS
// animation from frame 0 every time, turning a smooth continuous pulse
// into a visible stutter.
let _lastTrendKey = null;
function updateTrendIndicator(cfg, nowMs) {
  const el = document.getElementById('trend-indicator');
  if (!el) return;
  const delta = computeHealthTrend(cfg, nowMs);
  const count = trendArrowCount(delta);
  const isUp = delta > 0;
  const key = count === 0 ? 'none' : (isUp ? 'up' : 'down') + count;
  if (key === _lastTrendKey) return;
  _lastTrendKey = key;
  if (count === 0) { el.style.display = 'none'; el.innerHTML = ''; el.className = ''; return; }
  el.className = isUp ? 'up' : 'down';
  el.style.display = 'flex';
  el.innerHTML = trendArrowMarkup(count, isUp);
}

// scenario and stays fixed for the session; live "state" (eyes/mouth/skin
// tint/sweat) is re-derived every tick from SimEngine.getAppearanceState(),
// the same severity bands sim_control.html's assessor-facing Appearance tab
// uses — see sim_engine.js.
let avatarBuild = { skin: '#E0AC81', hairColour: '#3b2b20', hairStyle: 'shortFlat', eyebrowStyle: 'defaultNatural', ageBand: 'adult', ageYears: null, clothesColour: '#3b6ea5', voiceSeed: null };
// Last three are grey/silver/white — see GREY_HAIR_COLOURS and greyWeight()
// below. Kept in the same flat array (not a separate palette) so an unset
// age still lets a young-reading grey/premature-grey/platinum tone turn up
// occasionally, same "soft weighting, not a hard rule" approach as gender.
let HAIR_COLOURS = ['#1b1410', '#3b2b20', '#5a3b23', '#8a5a2b', '#c9a227', '#7a2e1d', '#8c8c8c', '#b0b0b0', '#e8e4dc'];

// patient_meta.age is patient.age verbatim from generator.html — a plain
// number of years, a "N months" string, or the literal string "newborn".
// Returns null (not 0) when nothing usable is present, so callers can tell
// "genuinely unknown" apart from "known to be very young".
function parseAgeYears(age) {
  if (age == null) return null;
  if (typeof age === 'string') {
    if (/newborn/i.test(age)) return 0;
    const m = age.match(/(\d+(?:\.\d+)?)\s*month/i);
    if (m) return parseFloat(m[1]) / 12;
    const n = parseFloat(age);
    return Number.isFinite(n) ? n : null;
  }
  return Number.isFinite(age) ? age : null;
}

// Populates the "Patient / Scene Info" panel from the live scenario row
// instead of the placeholder text it shipped with. `scen.dispatch` and
// `hx.nature` are both written by generator.html to be diagnosis-free (the
// dispatch prompt explicitly forbids revealing the diagnosis) — this is the
// same pre-arrival/on-scene information a real crew would already have, not
// an answer key. Falls back to '—' per row when a scenario predates a field
// rather than fabricating something.
function renderPatientInfoPanel(scen, meta, gender, age) {
  const genderLabel = gender === 'male' ? 'Male' : gender === 'female' ? 'Female' : null;
  let ageLabel = null;
  if (typeof age === 'number' && Number.isFinite(age)) ageLabel = `${age}yo`;
  else if (typeof age === 'string' && age.trim()) ageLabel = /newborn/i.test(age) ? 'Newborn' : age.trim();
  const demographics = [ageLabel, genderLabel].filter(Boolean).join(' ') || scen.title || '—';
  document.getElementById('pi-demographics').textContent = demographics;
  document.getElementById('pi-dispatch').textContent = `Dispatch: ${scen.dispatch || '—'}`;
  const hx = scen.hx || {};

// Older scenarios predate patient_meta.age entirely (years === null), which
// deliberately falls through to 'adult' — the avatar's pre-existing default
// look, not a guess.
function ageBandFromMeta(age) {
  const years = parseAgeYears(age);
  if (years == null) return 'adult';
  if (years < 1) return 'infant';
  if (years < 5) return 'toddler';
  if (years < 12) return 'child';
  if (years < 18) return 'teen';
  return 'adult';
}
// How strongly hair colour should lean grey/silver/white — ramps from 0 at
// 40 to 1 at 75+. Deliberately gradual/wide rather than a step at some
// "elderly" cutoff; real greying is a spectrum, not a threshold.
function greyWeight(age) {
  const years = parseAgeYears(age);
  if (years == null) return 0;
  return Math.max(0, Math.min(1, (years - 40) / 35));
}
// Continuous function of EXACT age in years (not the 5 discrete ageBand
// buckets used elsewhere for hair-pool/grey-weighting decisions) — every
// age-scaling property below reaches its normal/adult value exactly AT age
// 18, easing linearly from its newborn (age 0) extreme, rather than jumping
// between fixed band values. The old banded version meant e.g. a same-day
// jump from "toddler" to "child" at the age-5 boundary instead of a smooth
// progression, and capped out at the 'teen' band's value for anyone up to
// 17 rather than actually reaching 18.
function ageRamp(years, atZero, atEighteen) {
  if (years == null) return atEighteen; // unknown age -> adult default, matches ageBandFromMeta()'s own fallback
  const t = Math.max(0, Math.min(1, years / 18));
  return atZero + (atEighteen - atZero) * t;
}
