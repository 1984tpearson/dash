<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Sim — Self Test</title>
<style>
  html, body { height: 100%; height: 100dvh; margin: 0; overflow: hidden; background: linear-gradient(135deg, #2C4F7C 0%, #4E7FAE 55%, #6FA0CC 100%); color: #1e2a36; font-family: 'Courier New', monospace; }
  body { display: flex; flex-direction: column; }

  #st-topbar { flex-shrink: 0; position: relative; z-index: 50; background: #1c2f45; box-shadow: 0 2px 8px rgba(0,0,0,0.25); display: flex; flex-direction: column; gap: 4px; padding: 6px 10px; }
  .topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  #st-topbar .title { font-size: 12px; font-weight: 900; letter-spacing: 1px; color: #fff; text-transform: uppercase; white-space: nowrap; }

  /* --- Setup row: the only controls this page adds of its own ---------
     Everything else in the topbar mirrors the patient pane's own hidden
     topbar (see body.embed in sim_patient.html) exactly as sim_combo.html
     does it — same syncProxyState/forward-to-the-frame's-own-function
     approach, no reimplemented logic. */
  #st-setup { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: 1; min-width: 0; }
  #st-picker { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: 1; min-width: 0; }
  #st-picker.hidden { display: none; }
  #st-picker input[type="search"] { font-family: inherit; font-size: 11px; padding: 4px 7px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.12); color: #fff; width: 150px; min-width: 0; }
  #st-picker input[type="search"]::placeholder { color: rgba(255,255,255,0.5); }
  /* min-width:0 on both, not just a small floor: a flex item's automatic
     minimum is its own content size, and for a <select> that is its LONGEST
     OPTION — case titles here run to a full sentence, so the control forced
     the whole picker wider than the viewport and pushed Load Case off the
     right edge. Same trap as #head-wrap's in sim_patient.html (see the
     CLAUDE.md gotcha): max-width alone can't cap an element whose implicit
     minimum is bigger. The option text just clips instead; the filter box
     above it is how you narrow a long list. */
  #st-picker select { font-family: inherit; font-size: 11px; padding: 4px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.12); color: #fff; flex: 1 1 160px; min-width: 0; max-width: 420px; }
  #st-picker select option { background: #1c2f45; color: #fff; }
  .st-btn { font-family: inherit; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: #fff; background: #27833A; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
  .st-btn:disabled { opacity: 0.5; cursor: default; }
  .st-btn.secondary { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); }
  .st-btn.danger { background: #b91c1c; }
  #st-status { font-size: 10px; color: rgba(255,255,255,0.75); }
  #st-status.error { color: #fca5a5; }

  /* Mirrored patient-pane controls — hidden until there's a live session,
     same reasoning as sim_combo.html's #proxy-row: before that, none of
     them applies to anything yet. */
  #st-live-row { display: none; }
  #st-live-row.has-content { display: flex; }
  #st-live { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 10px; color: rgba(255,255,255,0.85); }
  #st-live label { display: flex; align-items: center; gap: 3px; cursor: pointer; }
  #st-live select { font-size: 10px; background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.3); border-radius: 6px; padding: 2px 4px; }
  #st-live select option { background: #1c2f45; }
  .st-badge { display: none; align-items: center; gap: 5px; font-size: 10px; font-weight: 700; }
  .st-badge.on { display: flex; }
  #st-pause-indicator.on { color: #fbbf24; }
  #st-instant-indicator.on { color: rgba(255,255,255,0.85); font-weight: 400; }
  #st-scenario-timer { font-weight: 700; color: #4ade80; }

  /* Covers the patient frame until a case is paired. sim_patient.html's own
     6-digit-code gate is suppressed here (?nogate=1 — see that file): there
     is no code for the student to type, this page pairs the frame itself the
     moment the session exists. */
  /* --- Phone layout -------------------------------------------------
     The bar was taking four wrapped rows on a phone, against a patient
     view that is the entire point of the page. Three things go, in order
     of how little they earn their height:
       - the page title, which tells a student nothing they don't know;
       - the status line, EXCEPT when it is reporting an error (the
         waiting panel over the frame carries the same wording before a
         case is running, so nothing is lost until then);
       - "Instant Mode" / RT Voice's word labels, down to their symbols.
     Everything else just tightens. */
  @media (max-width: 700px) {
    /* The two bar rows stop being rows and let their contents flow into one
       wrapping line — so once the picker is gone, End + display mode + voice
       + timer sit on a single line instead of two. display:contents needs
       the id-level override, or #st-live-row.has-content's own display:flex
       (id + class) wins and forces it back onto its own row. */
    #st-topbar { padding: 4px 6px; gap: 2px; flex-direction: row; flex-wrap: wrap; align-items: center; }
    .topbar-row, #st-live-row, #st-live-row.has-content { display: contents; }
    #st-live-row:not(.has-content) #st-live { display: none; }
    /* 0 1 auto, not 0 0 auto: it must still SHRINK. flex-shrink:0 let it take
       its max-content width (the picker's longest case title) and the only
       reason that didn't scroll the page is body's overflow:hidden — it
       clipped Load Case off the right edge instead. */
    #st-setup { flex: 0 1 auto; min-width: 0; max-width: 100%; }
    #st-live { flex: 1; min-width: 0; }
    #st-topbar .title { display: none; }
    #st-status { display: none; }
    #st-status.error { display: block; flex-basis: 100%; }
    #st-picker input[type="search"] { flex: 1 1 90px; min-width: 0; width: auto; }
    /* The case list gets the full width and, ordered first, its own line —
       which lets the filter and Load Case share the line below it instead
       of taking one each. */
    #st-picker select { order: -1; flex-basis: 100%; max-width: none; }
    .st-btn { flex-shrink: 0; }
    #st-live { gap: 8px; width: 100%; }
    #st-live label span { display: none; }
    #st-instant-indicator.on { font-size: 9px; }
    #st-scenario-timer { margin-left: auto; }
    .st-btn { padding: 5px 9px; }
  }

  #st-body { flex: 1; min-height: 0; display: flex; position: relative; }
  #st-waiting { position: absolute; inset: 0; z-index: 40; background: rgba(20,30,45,0.92); display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; }
  #st-waiting.hidden { display: none; }
  #st-waiting .card { background: #fff; border-radius: 10px; padding: 18px 20px; max-width: 320px; }
  #st-waiting h2 { font-size: 15px; margin: 0 0 8px; color: #1c2f45; }
  #st-waiting p { font-size: 12px; line-height: 1.5; color: #6b8299; margin: 0; }
  iframe { border: none; background: #14243a; }
  #patient-frame { flex: 1; width: 100%; height: 100%; }

  /* The control pane is mounted but has no size — it exists purely as the
     engine room (see the comment above its markup). It is revealed, full
     screen, only while its own debrief overlay is open. */
  #control-frame { position: fixed; inset: 0; width: 0; height: 0; opacity: 0; pointer-events: none; z-index: 60; }
  body.show-debrief #control-frame { width: 100%; height: 100%; opacity: 1; pointer-events: auto; }
</style>
</head>
<body>

<div id="st-topbar">
  <div class="topbar-row">
    <div class="title">Sim — Self Test</div>
    <div id="st-setup">
      <!-- The picker is only ever used once, before a case is running, so it
           leaves the bar entirely at that point rather than sitting there
           disabled — on a phone it was most of the topbar's height. New Case
           reloads the page and brings it back. -->
      <div id="st-picker">
        <input type="search" id="st-search" placeholder="Filter cases…" oninput="renderScenarioOptions()" aria-label="Filter cases">
        <select id="st-scenario-select" aria-label="Case"><option value="">Loading cases…</option></select>
        <button class="st-btn" id="st-load-btn" onclick="loadCase()" disabled>Load Case</button>
      </div>
      <button class="st-btn" id="st-start-btn" onclick="startScenario()" style="display:none;" title="Optional — the scenario also starts by itself the moment you do anything on the patient screen">Start</button>
      <button class="st-btn danger" id="st-end-btn" onclick="endScenario()" style="display:none;">End &amp; Debrief</button>
      <button class="st-btn secondary" id="st-new-btn" onclick="location.reload()" style="display:none;">New Case</button>
    </div>
    <div id="st-status">Starting up…</div>
  </div>
  <div class="topbar-row" id="st-live-row">
    <div id="st-live">
      <span id="st-pause-indicator" class="st-badge">&#9208; PAUSED</span>
      <span id="st-instant-indicator" class="st-badge">Instant Mode: ON</span>
      <select id="st-display-mode-select" onchange="proxySetDisplayMode(this.value)" title="What this screen shows">
        <option value="standard">🖥️ Standard</option>
        <option value="monitor">📈 Monitor Only</option>
        <option value="avatar">🧑 Avatar Only</option>
      </select>
      <label title="Low-latency voice conversation, on by default — untick for the standard tap-to-talk voice"><input type="checkbox" id="st-rt-voice" onchange="proxySetRtVoice(this.checked)">&#9889;<span>&nbsp;RT Voice</span></label>
      <span id="st-rt-voice-status"></span>
      <div id="st-scenario-timer">00:00</div>
    </div>
  </div>
</div>

<div id="st-body">
  <!-- The student-facing view, and the only thing normally visible. -->
  <iframe id="patient-frame" title="Sim Patient" allow="microphone; autoplay"></iframe>
  <div id="st-waiting">
    <div class="card">
      <h2 id="st-waiting-title">Pick a case to begin</h2>
      <p id="st-waiting-text">Choose a case in the bar above and press Load Case. Everything after that is yours to run — assess, treat and talk to the patient as you normally would.</p>
    </div>
  </div>
</div>

<!-- The assessor page, mounted at zero size and never shown except for its
     own debrief overlay. It is NOT decoration: sim_control.html owns session
     creation, the cached AI trajectory, and — critically — the loop that
     drains the patient device's student_queue and reasons about each
     treatment (classifyTreatmentWithHaiku / regenerateTimelineAfterTreatment
     both live there, see CLAUDE.md). Without a control page attached to the
     session, anything the student does reaches a void. So this page drives it
     programmatically instead of showing it: exactly the same functions its own
     buttons call, just with no way for the student to reach the assessor-side
     information (dispatch answers, trajectory, provisional diagnosis). -->
<iframe id="control-frame" title="Sim Control (hidden engine)"></iframe>

<script>
// Same cache-busting reasoning as sim_combo.html — reloading this document
// force-revalidates only itself; the iframes are ordinary subresources and
// would happily serve a stale cached copy of either page after a push.
const CACHE_BUST = Date.now();
document.getElementById('control-frame').src = 'sim_control.html?embed=1&v=' + CACHE_BUST;
document.getElementById('patient-frame').src = 'sim_patient.html?embed=1&nogate=1&v=' + CACHE_BUST;

let _scenarios = [];
let _sessionCode = null;
let _hasStarted = false;

function ctrlWin() { return document.getElementById('control-frame').contentWindow; }
function ctrlDoc() { return document.getElementById('control-frame').contentDocument; }
function patWin() { return document.getElementById('patient-frame').contentWindow; }
function patDoc() { return document.getElementById('patient-frame').contentDocument; }

// The waiting panel doubles as the page's error surface while nothing is
// running — before a case is loaded the frame behind it is a blank monitor,
// so a failure that only wrote to the thin topbar status line would be easy
// to miss entirely.
function setWaiting(title, text) {
  const el = document.getElementById('st-waiting');
  if (title === null) { el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  document.getElementById('st-waiting-title').textContent = title;
  document.getElementById('st-waiting-text').textContent = text;
}

function setStatus(text, isError) {
  const el = document.getElementById('st-status');
  el.textContent = text;
  el.classList.toggle('error', !!isError);
}

// ---------------------------------------------------------------------
// Startup. sim_control.html loads its scenario list behind its own auth
// gate (initAuth → requireAuth → loadRecentScenarios), and that gate
// REDIRECTS rather than rendering an error: a guest goes to
// sim_patient.html, a signed-out user to login.html. Inside an iframe
// that navigates only the frame, so the symptom would otherwise be a
// silently blank engine room. Hence checking what the frame is actually
// showing, not just whether its functions exist.
// ---------------------------------------------------------------------
async function waitForControlFrame() {
  for (let i = 0; i < 120; i++) { // ~30s
    try {
      const d = ctrlDoc();
      const w = ctrlWin();
      // about:blank is what the frame holds until its src load commits —
      // not a redirect, and treating it as one bounces the student to
      // login before the engine has had a chance to come up at all.
      const href = d && d.location ? d.location.href : '';
      if (href && href !== 'about:blank' && !/sim_control\.html/.test(href)) {
        setStatus('Sign in first — the self-test needs an instructor-side session to run the case. Opening the login page…', true);
        setWaiting('Sign in to run a case', 'The self-test needs a signed-in account to load cases. Taking you to the login page…');
        setTimeout(() => { location.href = 'login.html?redirect=sim_selftest.html'; }, 2500);
        return false;
      }
      if (w && typeof w.sbFetch === 'function' && typeof w.createSession === 'function') return true;
    } catch (e) { /* not loaded yet */ }
    await new Promise(r => setTimeout(r, 250));
  }
  setStatus('Could not start the scenario engine — reload the page.', true);
  setWaiting('Could not start up', 'The scenario engine did not come up. Reload the page to try again.');
  return false;
}

// Borrows the control frame's own sbFetch rather than repeating the
// Supabase URL/key here — one fewer copy of a credential to keep in step.
async function loadScenarioList() {
  try {
    _scenarios = await ctrlWin().sbFetch('scenarios?order=created_at.desc&limit=200&select=id,title,subtitle', { method: 'GET' });
  } catch (e) {
    document.getElementById('st-scenario-select').innerHTML = '<option value="">Could not load cases</option>';
    setStatus('Could not load the case list: ' + e.message, true);
    return;
  }
  renderScenarioOptions();
  setStatus(_scenarios.length ? 'Pick a case and load it.' : 'No cases found.');
  document.getElementById('st-load-btn').disabled = !_scenarios.length;
}

function renderScenarioOptions() {
  const q = document.getElementById('st-search').value.trim().toLowerCase();
  const sel = document.getElementById('st-scenario-select');
  const keep = sel.value;
  const matches = _scenarios.filter(r =>
    !q || (r.title || '').toLowerCase().includes(q) || (r.subtitle || '').toLowerCase().includes(q));
  sel.innerHTML = matches.length
    ? matches.map(r => `<option value="${escapeAttr(r.id)}">${escapeHtml(r.title || 'Untitled')}${r.subtitle ? ' — ' + escapeHtml(r.subtitle) : ''}</option>`).join('')
    : '<option value="">No cases match that filter</option>';
  if (matches.some(r => r.id === keep)) sel.value = keep;
  document.getElementById('st-load-btn').disabled = !sel.value;
}

function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function escapeAttr(s) { return escapeHtml(s); }

// ---------------------------------------------------------------------
// Load → Start → End, each forwarded onto the control page's own
// functions. The student never sees the panel those buttons live on.
// ---------------------------------------------------------------------
async function loadCase() {
  const id = document.getElementById('st-scenario-select').value;
  if (!id) return;
  const btn = document.getElementById('st-load-btn');
  btn.disabled = true;
  document.getElementById('st-search').disabled = true;
  document.getElementById('st-scenario-select').disabled = true;
  document.getElementById('st-picker').classList.add('hidden');
  setStatus('Preparing the case (this can take a few seconds the first time it is used)…');
  setWaiting('Preparing the case…', 'Building the patient\u2019s course from the case notes. This can take a few seconds the first time a case is used.');

  // Drive the control page's own scenario <select>, splicing the chosen
  // case in if it isn't among the 10 that page loads for itself — the
  // same thing handleScenarioDeepLink() does there for a deep link.
  try {
    const d = ctrlDoc();
    const csel = d.getElementById('scenario-select');
    if (!Array.from(csel.options).some(o => o.value === id)) {
      const row = _scenarios.find(r => r.id === id) || { id, title: 'Selected case' };
      const opt = d.createElement('option');
      opt.value = row.id;
      opt.textContent = row.title + (row.subtitle ? ' — ' + row.subtitle : '');
      csel.prepend(opt);
    }
    csel.value = id;
    await ctrlWin().createSession();
  } catch (e) {
    setStatus('Could not prepare the case: ' + e.message, true);
    setWaiting('Could not load that case', e.message + ' — pick a case and try again.');
    resetSetupControls();
    return;
  }

  _sessionCode = await readSessionCode();
  if (!_sessionCode) {
    // createSession() reports its own failure into a status line the
    // student can't see, so surface it here rather than leaving them on
    // a spinner that never resolves.
    let why = '';
    try { why = ctrlDoc().getElementById('create-status').textContent || ''; } catch (e) {}
    setStatus(why || 'Could not create the session — try again.', true);
    setWaiting('Could not start that case', why || 'The session could not be created — try again.');
    resetSetupControls();
    return;
  }

  pairPatientFrame(_sessionCode);
  armAutoStart();
  setWaiting(null);
  document.getElementById('st-start-btn').style.display = '';
  document.getElementById('st-new-btn').style.display = '';
  setStatus('Case ready — start assessing, or press Start.');
}

// The control page's session code lives in a top-level `let sessionCode`,
// which in a classic script goes into the script's global LEXICAL scope —
// NOT onto window — so ctrlWin().sessionCode is undefined however
// obviously "global" it looks. Read the rendered #code-display instead,
// which is what sim_combo.html has always done and for the same reason.
// enterSession() populates it synchronously, but poll briefly anyway
// rather than assume ordering.
async function readSessionCode() {
  for (let i = 0; i < 20; i++) {
    try {
      const text = (ctrlDoc().getElementById('code-display').textContent || '').trim();
      if (/^\d{6}$/.test(text)) return text;
    } catch (e) {}
    await new Promise(r => setTimeout(r, 150));
  }
  return null;
}

function resetSetupControls() {
  document.getElementById('st-picker').classList.remove('hidden');
  document.getElementById('st-load-btn').disabled = false;
  document.getElementById('st-search').disabled = false;
  document.getElementById('st-scenario-select').disabled = false;
}

// Same approach as sim_combo.html's pairing: hand the code to the patient
// frame's own connectSession() rather than reloading it with ?code=, so a
// display-mode choice already made there survives.
function pairPatientFrame(code) {
  try {
    const w = patWin();
    if (w && typeof w.connectSession === 'function') w.connectSession(code);
    else document.getElementById('patient-frame').src = 'sim_patient.html?embed=1&nogate=1&v=' + CACHE_BUST + '&code=' + encodeURIComponent(code);
  } catch (e) {
    setStatus('Could not connect the patient view (' + e.message + ') — reload the page.', true);
  }
}

// Auto-start: the student shouldn't have to press Start, so the first thing
// they actually DO starts the clock. One capture-phase listener on the
// patient document rather than wrapping its action functions individually
// — there are a dozen entry points already (the three fabs, vital taps, the
// BP/one-off cards, Apply ECG / apply-all, the three defib buttons, typed
// send) and wrapping them by name means anything added later silently stops
// counting as "performing something".
//
// Gated on the tap landing on something interactive, so a stray tap on the
// monitor's background doesn't start a run the student isn't ready for.
// Capture phase and non-cancelling: this observes the tap on its way down
// and lets it proceed to its own handler untouched — the action itself
// never waits on the PATCH that starts the clock.
let _autoStartDoc = null;
function armAutoStart() {
  let d;
  try { d = patDoc(); } catch (e) { return; }
  if (!d || d === _autoStartDoc) return;
  _autoStartDoc = d;
  d.addEventListener('pointerdown', (ev) => {
    if (_hasStarted || _starting || !_sessionCode) return;
    const t = ev.target;
    if (!t || !t.closest) return;
    if (!t.closest('button, select, input, textarea, [onclick], [role="button"]')) return;
    startScenario();
  }, true);
}

let _starting = false;
async function startScenario() {
  if (_hasStarted || _starting) return;
  _starting = true;
  const btn = document.getElementById('st-start-btn');
  btn.disabled = true;
  try {
    await ctrlWin().toggleRun();
  } catch (e) {
    setStatus('Could not start the scenario: ' + e.message, true);
    btn.disabled = false;
    _starting = false;
    return;
  }
  _hasStarted = true;
  btn.style.display = 'none';
  document.getElementById('st-end-btn').style.display = '';
  document.getElementById('st-new-btn').style.display = 'none'; // reloading mid-run would abandon a live session
  setStatus('Running — assess and treat as you normally would.');
}

// endScenario() runs its own confirm(), freezes the clock, and opens the
// debrief overlay inside the control frame — which syncLiveState() then
// reveals. The debrief is deliberately available here: this page has no
// assessor, so it is the only feedback the student gets, and it is a flat
// factual record (no AI commentary, nothing implying right or wrong) by
// design — see the comment above showDebrief() in sim_control.html.
function endScenario() {
  try { ctrlWin().endScenario(); } catch (e) { setStatus('Could not end the scenario: ' + e.message, true); }
}

// ---------------------------------------------------------------------
// State mirroring, ~1x/sec. Only reads display/text/class/checked off the
// two frames — never reaches into either page's session logic.
// ---------------------------------------------------------------------
function mirrorVisibility(srcEl, dstEl) {
  const shown = srcEl && srcEl.style.display !== 'none' && getComputedStyle(srcEl).display !== 'none';
  dstEl.classList.toggle('on', !!shown);
}

function syncLiveState() {
  document.getElementById('st-live-row').classList.toggle('has-content', !!_sessionCode);
  if (_sessionCode && !_hasStarted) armAutoStart(); // re-arms if the frame was re-navigated (see pairPatientFrame's src fallback)
  try {
    const d = patDoc();
    if (d) {
      mirrorVisibility(d.getElementById('pause-indicator'), document.getElementById('st-pause-indicator'));
      mirrorVisibility(d.getElementById('instant-mode-indicator'), document.getElementById('st-instant-indicator'));

      const sel = d.getElementById('display-mode-select');
      const mySel = document.getElementById('st-display-mode-select');
      if (sel && document.activeElement !== mySel) mySel.value = sel.value;

      const rt = d.getElementById('rt-voice-checkbox');
      const myRt = document.getElementById('st-rt-voice');
      if (rt && document.activeElement !== myRt) myRt.checked = rt.checked;
      const rtStatus = d.getElementById('rt-voice-status');
      if (rtStatus) document.getElementById('st-rt-voice-status').textContent = rtStatus.textContent;

      const timer = d.getElementById('scenario-timer');
      if (timer) document.getElementById('st-scenario-timer').textContent = timer.textContent;
    }
  } catch (e) {}
  try {
    const d = ctrlDoc();
    const overlay = d && d.getElementById('debrief-overlay');
    const open = !!(overlay && overlay.classList.contains('open'));
    document.body.classList.toggle('show-debrief', open);
    if (open && _hasStarted) {
      document.getElementById('st-end-btn').style.display = 'none';
      document.getElementById('st-new-btn').style.display = '';
      setStatus('Scenario ended — debrief shown. Close it to see the final screen.');
    }
  } catch (e) {}
}

function proxySetDisplayMode(mode) { try { patWin().setDisplayMode(mode); } catch (e) {} }
function proxySetRtVoice(on) { try { patWin().setRtVoiceEnabled(on); } catch (e) {} }

setInterval(syncLiveState, 1000);

// Don't let a stray refresh/close silently abandon a running session.
window.addEventListener('beforeunload', (e) => {
  if (_sessionCode && _hasStarted && !document.body.classList.contains('show-debrief')) {
    e.preventDefault();
    e.returnValue = '';
  }
});

(async function init() {
  if (!(await waitForControlFrame())) return;
  await loadScenarioList();
})();

document.getElementById('st-scenario-select').addEventListener('change', () => {
  document.getElementById('st-load-btn').disabled = !document.getElementById('st-scenario-select').value;
});
</script>

</body>
</html>
